<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자율운행 포트폴리오 MVP 예시</title>
<!--
  ─────────────────────────────────────────────────────────────
  발표용 HTML MVP 예시 (HTML + CSS + JS, 파일 하나)

  구조 — 화면과 엔진을 나눈다
    · 화면(이 파일): 버튼을 누르면 엔진을 부르고, 엔진이 남긴 파일을 "읽어서" 보여 준다.
    · 엔진(run_all.py): 에이전트를 돌리고 runs/<실행번호>/ 에 파일을 저장한다.

  이 예시는 엔진 없이도 열리도록 callEngine() 안에 "예시 실행 결과"를 넣어 두었다.
  실제 팀 프로젝트에서는 callEngine() 한 곳만 서버 호출(fetch)로 바꾸면 된다.

  화면 규칙 3가지
    1) 화면은 숫자를 계산하지 않는다 — 파일에 적힌 값을 그대로 보여 준다.
    2) 실행 번호(run_id)를 항상 보여 준다.
    3) 사람이 누른 버튼(승인·정지)은 개입 기록에 남긴다.
  ─────────────────────────────────────────────────────────────
-->
<style>
  :root {
    --ink: #071A1D; --paper: #F7F5F0; --lime: #B7F34A; --teal: #0B6B68;
    --red: #C00000; --muted: #64757D; --line: #DDE3E2; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans KR", system-ui, sans-serif; background: var(--paper); color: #102027; }
  header { background: var(--ink); color: var(--white); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 20px; }
  header .run { font-family: monospace; color: var(--lime); font-size: 14px; }

  /* 버튼 줄 */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px; }
  button { font: inherit; font-weight: 700; font-size: 15px; padding: 10px 14px; border-radius: 8px;
           border: 2px solid var(--teal); background: var(--white); color: var(--teal); cursor: pointer; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.main { background: var(--lime); border-color: var(--lime); color: #102027; }
  button.human { background: var(--ink); border-color: var(--ink); color: var(--lime); }
  button.stop { border-color: var(--red); color: var(--red); }
  select { font: inherit; padding: 9px; border-radius: 8px; border: 2px solid var(--teal); }

  /* 세 칸 화면 */
  main { display: grid; grid-template-columns: 260px 1fr 300px; gap: 14px; padding: 0 20px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-height: 360px; }
  .panel.dark { background: var(--ink); color: var(--white); border: 0; }
  .panel h2 { margin: 0 0 12px; font-size: 16px; color: var(--teal); }
  .panel.dark h2 { color: var(--lime); }

  /* ① 진행 단계 */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { padding: 7px 8px; border-radius: 6px; cursor: pointer; color: #9FB0B2; }
  .steps li.done { color: var(--white); }
  .steps li.done::before { content: "✓ "; color: var(--lime); }
  .steps li.now { background: var(--lime); color: #102027; font-weight: 700; }
  .steps li.now::before { content: "● "; }
  .steps li.wait { background: #3a2a00; color: #FFD27A; font-weight: 700; }
  .steps li.sel { outline: 2px solid var(--lime); }

  /* ② 근거 파일 */
  pre { background: var(--paper); border-radius: 8px; padding: 12px; white-space: pre-wrap; font-size: 14px; line-height: 1.55; margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* ③ 결과 요약 */
  .w { display: grid; grid-template-columns: 50px 1fr 52px; align-items: center; gap: 6px; margin: 6px 0; font-size: 14px; }
  .w .b { height: 16px; background: var(--teal); border-radius: 3px; transition: width .6s; }
  .kv { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding: 7px 0; font-size: 14px; }
  .kv b.ok { color: var(--teal); } .kv b.bad { color: var(--red); }

  /* 아래 줄: 비교표 · 개입 기록 */
  .bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 20px 24px; }
  @media (max-width: 900px) { .bottom { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 400; }
  .log { font-family: monospace; font-size: 13px; max-height: 180px; overflow: auto; }

  /* 1쪽 보고서 (IC 보고서 + CIO 결정) */
  .overlay { position: fixed; inset: 0; background: rgba(7,26,29,.6); display: none; overflow: auto; padding: 24px 12px; }
  .overlay.show { display: block; }
  .page { background: var(--white); max-width: 760px; margin: 0 auto; padding: 32px 36px; border-radius: 6px; font-size: 14px; line-height: 1.6; }
  .page h3 { margin: 0; font-size: 22px; }
  .page .meta { color: var(--muted); font-size: 12px; margin: 4px 0 14px; border-bottom: 3px solid var(--ink); padding-bottom: 8px; }
  .page h4 { margin: 16px 0 6px; font-size: 15px; color: var(--teal); }
  .page .verdict { display: flex; gap: 10px; flex-wrap: wrap; }
  .page .chip { padding: 6px 12px; border-radius: 6px; background: var(--paper); font-weight: 700; }
  .page .chip.final { background: var(--lime); }
  .page .minority { border-left: 4px solid var(--red); padding: 6px 10px; background: #fff5f5; }
  .page .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .page .actions.top { position: sticky; top: -24px; margin: -32px -36px 14px; padding: 10px 36px; background: var(--white); border-bottom: 1px solid var(--line); z-index: 1; }
  .page pre { font-size: 14px; }
  /* ② 근거 파일 머리 — 제목 + 인쇄 · 닫기 */
  .phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
  .phead h2 { margin: 0 !important; }
  .ftools { display: flex; gap: 6px; flex-shrink: 0; }
  button.sm { font-size: 13px; padding: 5px 9px; border-width: 1.5px; }
  @media print {
    @page { margin: 18mm; }
    body { background: #fff; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body > *:not(.overlay) { display: none !important; }
    .overlay { position: static; background: none; padding: 0; display: block; }
    .page { max-width: none; padding: 0; }
    .page .actions { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>자율운행 포트폴리오 · 시연 화면 (예시)</h1>
  <span class="run" id="runLabel">run_id: —</span>
</header>

<!-- 버튼 줄: 버튼마다 README에 같은 일을 하는 명령이 있어야 한다 -->
<div class="bar">
  <button class="main" id="btnLive">▶ 라이브 실행</button>
  <button id="btnReplay">▷ 재생 실행</button>
  <select id="shock">
    <option value="A">돌발 A · 위험 한도 강화</option>
    <option value="B">돌발 B · 침체 신호</option>
    <option value="C">돌발 C · LLM 교체</option>
  </select>
  <button id="btnShock">◆ 돌발 과제 투입</button>
  <button id="btnCompare">⇄ 두 실행 비교</button>
  <button class="human" id="btnApprove" disabled>✓ 사람 승인</button>
  <button class="stop" id="btnStop" disabled>■ 긴급 정지</button>
  <button id="btnReport" disabled>📄 1쪽 보고서</button>
</div>

<main>
  <section class="panel dark">
    <h2>① 진행 단계</h2>
    <ul class="steps" id="steps"></ul>
    <p class="hint" style="color:#9FB0B2">끝난 단계를 누르면 그 단계의 파일이 열린다</p>
  </section>

  <section class="panel">
    <div class="phead">
      <h2 id="fileTitle">② 근거 파일</h2>
      <span class="ftools"><button class="sm" id="btnFilePrint" disabled>🖨 인쇄</button><button class="sm" id="btnFileClose" disabled>✕ 닫기</button></span>
    </div>
    <pre id="fileBody">▶ 라이브 실행을 누르면 시작한다.</pre>
    <p class="hint">화면은 runs/ 폴더의 파일을 그대로 읽어 보여 준다</p>
  </section>

  <section class="panel">
    <h2>③ 결과 요약</h2>
    <div id="summary"><p class="hint">아직 결과가 없다</p></div>
  </section>
</main>

<div class="bottom">
  <section class="panel" style="min-height:auto">
    <h2>⇄ 실행 비교</h2>
    <div id="compare"><p class="hint">실행을 두 번 이상 하면 비교할 수 있다</p></div>
  </section>
  <section class="panel" style="min-height:auto">
    <h2>사람 개입 기록 (intervention_log)</h2>
    <div class="log" id="log">기록 없음</div>
  </section>
</div>

<!-- 실행이 끝나면 뜨는 1쪽 보고서 (인쇄하면 이 부분만 나온다) -->
<div class="overlay" id="overlay"><div class="page" id="page"></div></div>

<script>
// ─────────────────────────────────────────────────────────────
// 1. 단계 목록 — 참고 설계의 리서치 + ①~⑧
// ─────────────────────────────────────────────────────────────
const STEPS = [
  { id: "research", name: "리서치 브리프",   file: "research_brief.md" },
  { id: "regime",   name: "① 국면 판단",     file: "regime.json" },
  { id: "cma",      name: "② CMA · ③ 공분산", file: "cma.json" },
  { id: "build",    name: "④ 후보 구성 · CRO", file: "proposals.json" },
  { id: "vote",     name: "⑤ 검토 · 투표",    file: "votes.json" },
  { id: "ic",       name: "⑥ IC 심의",       file: "ic_report.md" },
  { id: "cio",      name: "⑦ CIO 결론",      file: "final_alloc.json" },
  { id: "meta",     name: "⑧ 메타 점검",     file: "meta_report.json" },
];

// ─────────────────────────────────────────────────────────────
// 2. 엔진 호출 — 화면에서 바꿔야 할 곳은 여기 하나뿐
//    실제 프로젝트:  return (await fetch("/api/run", {method:"POST",
//                    body: JSON.stringify({mode, scenario})})).json();
//    아래는 엔진 없이 열리도록 넣어 둔 "예시 실행 결과"다 (숫자는 설명용).
// ─────────────────────────────────────────────────────────────
async function callEngine(mode, scenario) {
  const base = {
    research: "# 리서치 브리프 (기준일 2026-11-30)\n- 물가 둔화, 금리 동결 전망\n- 근거 등급 B · 출처 2건",
    regime:   { regime: "경기 후기", confidence: 0.62, model: "llm-x-2026" },
    cma:      { 주식: "6.8%", 채권: "4.1%", 실물: "5.5%", 현금: "3.0%" },
    build:    { 후보: 8, 탈락: 2, 탈락사유: "추적오차 초과 2건" },
    vote:     { "1위": "최대 분산 (96점)", "2위": "블랙-리터만 (76점)", 계열수: 4 },
    ic:       "# IC 보고서\n표결 3 : 1 · 승인\n- 수익 위원 찬성\n- 위험 위원 찬성\n- IPS 위원 찬성\n- 반대 위원 반대: 채권 금리 위험",
    cio:      { 조합법: "최대 분산", 비중: { 주식: 44.9, 채권: 35.1, 실물: 15.0, 현금: 5.0 },
                추적오차: 2.4, 한도: 6.0, 유효종목수: 9.8, IPS위반: 0 },
    meta:     { 경보: ["CMA 오차 기준선보다 나쁨"], 개선안: 1, 분류: "큰 수정 → 사람 ③ 승인 대기" },
    // 1쪽 보고서(report.json) — 엔진이 IC 보고서와 CIO 결정을 묶어 쓴 파일
    memo: { 안건: "2026년 12월 전략적 자산배분안",
            표결: "3 : 1", 권고: "승인",
            위원: [["수익 위원", "찬성", "CMA 근거가 충분하다"],
                   ["위험 위원", "찬성", "예상 낙폭이 IPS 범위 안이다"],
                   ["IPS 위원", "찬성", "모든 한도를 지킨다"],
                   ["반대 위원", "반대", "채권 비중이 금리 상승에 취약하다"]],
            소수의견: "금리가 0.5%p 오르면 채권 손실이 커진다 — 다음 주기 점검 요청",
            CIO결정: "IC 권고대로 승인", CIO이유: "권고와 같음 — 반대 의견은 ⑧ 메타 점검 항목으로 넘김" },
  };
  // 돌발 과제: 입력만 바뀌고, 엔진이 다시 판단한 결과가 파일로 나온다
  const shock = {
    A: { needsSign: true,
         research: base.research + "\n- IPS v2: 추적오차 한도 6% → 4%",
         ic: "# IC 보고서\n표결 2 : 2 · 조건부 승인\n- IPS 위원: 새 한도 안에서만 승인\n- 반대 위원: 주식 축소 폭이 과하다",
         memo: { 안건: "IPS v2(추적오차 한도 4%) 반영 배분안", 표결: "2 : 2", 권고: "조건부 승인",
                 위원: [["수익 위원", "반대", "주식 축소로 기대수익이 낮아진다"],
                        ["위험 위원", "찬성", "새 한도에 여유가 있다"],
                        ["IPS 위원", "찬성", "IPS v2 한도를 모두 지킨다"],
                        ["반대 위원", "반대", "주식 축소 폭이 과하다"]],
                 소수의견: "현금 8%는 과하다 — 다음 주기에 채권으로 옮길 것",
                 CIO결정: "조건부 승인 → 승인으로 확정", CIO이유: "표결 동수 — IPS 준수를 우선해 확정, 현금 비중은 다음 주기 재검토" },
         cio: { 조합법: "위험 균형", 비중: { 주식: 38.0, 채권: 40.0, 실물: 14.0, 현금: 8.0 },
                추적오차: 1.9, 한도: 4.0, 유효종목수: 10.6, IPS위반: 0 } },
    B: { research: "# 리서치 브리프 (돌발 B)\n- 실업수당 청구 급증 · 장단기 금리 역전 심화\n- 근거 등급 A",
         regime: { regime: "침체 진입", confidence: 0.71, model: "llm-x-2026" },
         ic: "# IC 보고서\n표결 4 : 0 · 승인\n- 위험 위원: 방어 자산 비중 확대 지지",
         memo: { 안건: "침체 신호(돌발 B) 반영 배분안", 표결: "4 : 0", 권고: "승인",
                 위원: [["수익 위원", "찬성", "기대수익 하락을 감수할 만하다"],
                        ["위험 위원", "찬성", "방어 자산 비중 확대를 지지한다"],
                        ["IPS 위원", "찬성", "모든 한도를 지킨다"],
                        ["반대 위원", "찬성", "침체 신호의 근거 등급이 A다"]],
                 소수의견: "없음",
                 CIO결정: "IC 권고대로 승인", CIO이유: "권고와 같음 — 근거 등급 A 리서치 반영" },
         cio: { 조합법: "최소 분산", 비중: { 주식: 32.0, 채권: 46.0, 실물: 10.0, 현금: 12.0 },
                추적오차: 3.6, 한도: 6.0, 유효종목수: 8.9, IPS위반: 0 } },
    C: { regime: { regime: "경기 후기", confidence: 0.55, model: "llm-y-2026 (교체)" },
         ic: "# IC 보고서\n표결 3 : 1 · 승인\n- 판단 문장은 달라졌으나 결론 동일",
         memo: { 안건: "LLM 교체(돌발 C) 후 재실행 배분안", 표결: "3 : 1", 권고: "승인",
                 위원: [["수익 위원", "찬성", "CMA 근거 문장이 달라졌으나 결론 동일"],
                        ["위험 위원", "찬성", "낙폭 범위 안"],
                        ["IPS 위원", "찬성", "한도 준수"],
                        ["반대 위원", "반대", "새 모델의 국면 확신도가 낮다"]],
                 소수의견: "국면 확신도 0.62 → 0.55 — 모델 차이 기록 필요",
                 CIO결정: "IC 권고대로 승인", CIO이유: "결정론 계산 결과가 이전 실행과 거의 같음" },
         cio: { ...base.cio, 비중: { 주식: 45.3, 채권: 34.7, 실물: 15.0, 현금: 5.0 }, 추적오차: 2.5 } },
  };
  const out = { ...base, ...(scenario ? shock[scenario] : {}) };
  out.run_id = "2026-12-01_" + String(++runCount).padStart(2, "0");
  out.mode = mode; out.scenario = scenario || "기본";
  return out;
}

// ─────────────────────────────────────────────────────────────
// 3. 화면 상태
// ─────────────────────────────────────────────────────────────
let runCount = 0, runs = [], current = null, stopped = false, waiting = null;
let approveFor = null;   // 지금 ✓ 버튼이 무엇을 승인하는지 ("IPS 서명" 또는 "메타 개선안")
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function drawSteps(doneUpTo, nowIdx, waitIdx) {
  $("steps").innerHTML = STEPS.map((s, i) => {
    let cls = i < doneUpTo ? "done" : "";
    if (i === nowIdx) cls = "now";
    if (i === waitIdx) cls = "wait";
    return `<li class="${cls}" data-i="${i}">${s.name}${i === waitIdx ? " — 서명 대기" : ""}</li>`;
  }).join("");
}

function showFile(i) {
  if (!current) return;
  const s = STEPS[i], data = current[s.id];
  $("fileTitle").textContent = "② 근거 파일 · " + s.file;
  $("fileBody").textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  document.querySelectorAll(".steps li").forEach((li) => li.classList.toggle("sel", +li.dataset.i === i));
}

function showSummary(r) {
  const c = r.cio;  // 파일(final_alloc.json)의 값을 그대로 쓴다 — 여기서 계산하지 않는다
  const bars = Object.entries(c.비중).map(([k, v]) =>
    `<div class="w"><span>${k}</span><div class="b" style="width:${v * 2}%"></div><span>${v}%</span></div>`).join("");
  $("summary").innerHTML = bars +
    `<div class="kv"><span>조합법</span><b>${c.조합법}</b></div>
     <div class="kv"><span>추적오차 (한도)</span><b>${c.추적오차}% (≤ ${c.한도}%)</b></div>
     <div class="kv"><span>유효 종목 수</span><b>${c.유효종목수}</b></div>
     <div class="kv"><span>IPS 위반</span><b class="${c.IPS위반 ? "bad" : "ok"}">${c.IPS위반}건</b></div>
     <div class="kv"><span>실행 방식</span><b>${r.mode} · ${r.scenario}</b></div>`;
}

function log(action, reason) {
  const t = new Date().toLocaleTimeString("ko-KR");
  const who = "발표자";  // 실제로는 로그인한 팀원 이름
  const line = `${t} · ${who} · ${action} · ${reason} · run ${current ? current.run_id : "-"}`;
  $("log").innerHTML = ($("log").textContent === "기록 없음" ? "" : $("log").innerHTML + "<br>") + line;
}

function setBusy(busy) {
  ["btnLive", "btnReplay", "btnShock", "btnCompare"].forEach((id) => ($(id).disabled = busy));
  $("btnStop").disabled = !busy;
}

// ─────────────────────────────────────────────────────────────
// 4. 실행 — 라이브는 단계별로 천천히, 재생은 바로 보여 준다
// ─────────────────────────────────────────────────────────────
async function run(mode, scenario) {
  stopped = false; $("btnApprove").disabled = true;
  if (mode === "replay") {
    // 재생: 새 실행이 아니라 마지막 실행의 저장 파일을 다시 읽는다 (같은 run_id · 같은 숫자)
    if (!runs.length) { $("fileBody").textContent = "재생할 실행이 없다 — 먼저 ▶ 라이브 실행을 누른다."; return; }
    current = { ...runs[runs.length - 1], mode: "replay" };
  } else {
    current = await callEngine(mode, scenario);
  }
  setBusy(true);
  $("runLabel").textContent = "run_id: " + current.run_id;
  const delay = mode === "live" ? 700 : 80;

  for (let i = 0; i < STEPS.length; i++) {
    if (stopped) { drawSteps(i, -1, -1); setBusy(false); return; }
    // 돌발 A: IPS 새 버전은 사람이 서명해야 ①부터 진행된다
    if (current.needsSign && mode === "live" && i === 1) {
      drawSteps(i, -1, i);
      $("fileTitle").textContent = "② 근거 파일 · ips_v2.yaml";
      $("fileBody").textContent = "IPS v2 — 추적오차 한도 6% → 4%\n\n✓ 사람 승인 버튼으로 서명해야 다음 단계로 간다.";
      approveFor = "IPS v2 서명"; $("btnApprove").disabled = false;
      await new Promise((resolve) => (waiting = resolve));
      $("btnApprove").disabled = true;
      if (stopped) { drawSteps(i, -1, -1); setBusy(false); return; }
    }
    drawSteps(i, i, -1); showFile(i);
    await sleep(delay);
  }
  drawSteps(STEPS.length, -1, -1);
  showFile(5);               // 끝나면 IC 보고서를 먼저 연다
  showSummary(current);
  if (mode === "live") runs.push(current);
  setBusy(false);
  $("btnReport").disabled = false;
  // 사람 ③: 메타 에이전트의 큰 수정안은 사람이 승인해야 다음 주기에 반영된다
  if (mode === "live" && current.meta.분류.includes("승인 대기")) {
    approveFor = "메타 개선안 승인 (다음 주기 반영)"; $("btnApprove").disabled = false;
  }
  showReport(current);       // 마지막 산출물 — IC 권고와 CIO 결정을 한 쪽으로
}

// ─────────────────────────────────────────────────────────────
// 5. 비교표 — 두 실행의 파일 값을 나란히 놓기만 한다
// ─────────────────────────────────────────────────────────────
function compare() {
  if (runs.length < 2) { $("compare").innerHTML = '<p class="hint">실행이 두 번 이상 필요하다</p>'; return; }
  const [a, b] = runs.slice(-2);
  const row = (k, f) => `<tr><td>${k}</td><td>${f(a)}</td><td>${f(b)}</td></tr>`;
  $("compare").innerHTML = `<table>
    <tr><th>항목</th><th>${a.run_id} (${a.scenario})</th><th>${b.run_id} (${b.scenario})</th></tr>
    ${row("국면", (r) => r.regime.regime)}
    ${row("주식 비중", (r) => r.cio.비중.주식 + "%")}
    ${row("추적오차 (한도)", (r) => `${r.cio.추적오차}% (≤ ${r.cio.한도}%)`)}
    ${row("IC 표결", (r) => r.memo.표결 + " · " + r.memo.권고)}
    ${row("CIO 조합법", (r) => r.cio.조합법)}
  </table>`;
}


// ─────────────────────────────────────────────────────────────
// 7. 1쪽 보고서 — report.json · final_alloc.json의 값을 배치만 한다
// ─────────────────────────────────────────────────────────────
function showReport(r) {
  const m = r.memo, c = r.cio;
  const members = m.위원.map(([who, vote, why]) =>
    `<tr><td>${who}</td><td><b style="color:${vote === "찬성" ? "var(--teal)" : "var(--red)"}">${vote}</b></td><td>${why}</td></tr>`).join("");
  const weights = Object.entries(c.비중).map(([k, v]) => `<td>${k} <b>${v}%</b></td>`).join("");
  $("page").innerHTML = `${docActions("top")}
    <h3>IC 보고서 · CIO 결정</h3>
    <div class="meta">run_id ${r.run_id} · 실행 ${r.mode} · 시나리오 ${r.scenario} · 국면 ${r.regime.regime} · 모델 ${r.regime.model}</div>
    <h4>안건</h4><div>${m.안건}</div>
    <h4>⑥ IC 심의 — 권고</h4>
    <div class="verdict"><span class="chip">표결 ${m.표결}</span><span class="chip">IC 권고: ${m.권고}</span></div>
    <table style="margin-top:8px">${members}</table>
    <h4>소수의견</h4><div class="minority">${m.소수의견}</div>
    <h4>⑦ CIO 결정 — 최종</h4>
    <div class="verdict"><span class="chip final">${m.CIO결정}</span><span class="chip">조합법: ${c.조합법}</span></div>
    <div style="margin-top:6px">사유: ${m.CIO이유}</div>
    <table style="margin-top:8px"><tr>${weights}</tr></table>
    <table><tr><td>추적오차 ${c.추적오차}% (한도 ${c.한도}%)</td><td>유효 종목 수 ${c.유효종목수}</td><td>IPS 위반 ${c.IPS위반}건</td></tr></table>
    <h4>⑧ 메타 점검 — 다음 주기로</h4>
    <div>경보: ${r.meta.경보.join(", ")} · ${r.meta.분류}</div>
    ${docActions("")}`;
  $("overlay").classList.add("show");
}

// ─────────────────────────────────────────────────────────────
// 보고서 공용 — 모든 보고서(1쪽 보고서 · 근거 파일)에 인쇄 · 닫기를 위아래로 단다
// ─────────────────────────────────────────────────────────────
function docActions(pos) {
  return `<div class="actions ${pos}">
      <button onclick="window.print()">🖨 인쇄 · PDF 저장</button>
      <button class="main" onclick="closeDoc()">✕ 닫기</button>
    </div>`;
}
function closeDoc() { $("overlay").classList.remove("show"); }
const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// 지금 ② 칸에 열린 파일을 한 쪽짜리 보고서로 띄운다 — 파일 내용을 그대로 옮기기만 한다
function showFileReport() {
  const title = $("fileTitle").textContent.replace(/^② 근거 파일 · /, "");
  const r = current;
  $("page").innerHTML = `${docActions("top")}
    <h3>${esc(title)}</h3>
    <div class="meta">${r ? `run_id ${r.run_id} · 실행 ${r.mode} · 시나리오 ${esc(r.scenario)}` : "실행 전"} · 근거 파일</div>
    <pre>${esc($("fileBody").textContent)}</pre>
    ${docActions("")}`;
  $("overlay").classList.add("show");
}
// ② 칸의 내용이 바뀔 때마다 인쇄 · 닫기를 켠다
new MutationObserver(() => {
  const on = $("fileTitle").textContent !== "② 근거 파일";
  $("btnFilePrint").disabled = !on; $("btnFileClose").disabled = !on;
}).observe($("fileBody"), { childList: true, characterData: true, subtree: true });

// ─────────────────────────────────────────────────────────────
// 6. 버튼 연결
// ─────────────────────────────────────────────────────────────
$("btnLive").onclick   = () => run("live");
$("btnReplay").onclick = () => run("replay");
$("btnShock").onclick  = () => run("live", $("shock").value);
$("btnCompare").onclick = compare;
$("btnReport").onclick  = () => current && showReport(current);
$("overlay").onclick   = (e) => { if (e.target.id === "overlay") closeDoc(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDoc(); });
$("btnFilePrint").onclick = showFileReport;
$("btnFileClose").onclick = () => {
  $("fileTitle").textContent = "② 근거 파일";
  $("fileBody").textContent = "파일을 닫았다 — 끝난 단계를 누르면 다시 열린다.";
  document.querySelectorAll(".steps li").forEach((li) => li.classList.remove("sel"));
};
$("btnApprove").onclick = () => {
  log("✓ 승인", approveFor);
  if (waiting) { waiting(); waiting = null; } else $("btnApprove").disabled = true;
};
$("btnStop").onclick   = () => { stopped = true; log("■ 긴급 정지", "발표자 판단"); if (waiting) { waiting(); waiting = null; } };
$("steps").onclick = (e) => { const li = e.target.closest("li.done"); if (li) showFile(+li.dataset.i); };

drawSteps(0, -1, -1);
</script>
</body>
</html>
