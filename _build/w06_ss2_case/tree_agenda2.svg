<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='440' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='260.0' y='81.6' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ③′ 비유동 지분 ≥ 80% ?</text><text x='260.0' y='118.56' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(팔아서 비중을 맞출 자산이 있나)</text><line x1='480' y1='90' x2='640' y2='90' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='560' y='66' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예 · 국부펀드</text><rect x='640' y='40' width='440' height='100' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='860.0' y='82.2' text-anchor='middle' font-size='26' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>밴드 부적용</text><text x='860.0' y='116.52000000000001' text-anchor='middle' font-size='26' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>집중 한도 · 유동성 계정 하한 · 연 1회</text><line x1='260' y1='140' x2='260' y2='210' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='320' y='185' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오</text><rect x='40' y='210' width='440' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='260.0' y='251.60000000000002' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ③ 3%p 복원 &gt; 20 거래일 ?</text><text x='260.0' y='288.56' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>NPS 23일 · KIC 0.2일 · H대 0일</text><line x1='480' y1='260' x2='640' y2='260' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='560' y='236' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예 · 국민연금</text><rect x='640' y='210' width='440' height='100' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='860.0' y='252.2' text-anchor='middle' font-size='26' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>제1호 규칙 B</text><text x='860.0' y='286.52' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>밴드 ±3 + 총 위험 ±2 오버레이 · 월 · 한도</text><line x1='260' y1='310' x2='260' y2='380' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='320' y='355' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오</text><rect x='40' y='380' width='440' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='260.0' y='421.59999999999997' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ④′ 현금흐름 ≥ ½σ(드리프트) ?</text><text x='260.0' y='458.55999999999995' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>임계 1.4%/년 · H대 3.0 · KIC 0</text><line x1='480' y1='430' x2='640' y2='430' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='560' y='406' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예 · H대</text><rect x='640' y='380' width='440' height='100' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='860.0' y='422.2' text-anchor='middle' font-size='26' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>현금흐름 우선 · 월 점검</text><text x='860.0' y='456.52' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>지출·기부로 복원 → 잔여 현물 · 순 +36bp</text><line x1='260' y1='480' x2='260' y2='545' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='340' y='535' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오 · KIC</text><rect x='40' y='545' width='1040' height='85' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='560.0' y='580.0' text-anchor='middle' font-size='25' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>월말 목표 복원 · 현물 즉시(시장충격 0) — KIC 순 +45bp, NPS 규칙을 그대로 쓰면 +36bp</text><text x='560.0' y='613.0' text-anchor='middle' font-size='25' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>기본 답 — 안 B 지표 기반 차등: 네 기관 네 규칙, 지표는 하나의 표</text><rect x='1120' y='40' width='440' height='590' rx='10' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='1340.0' y='138.44' text-anchor='middle' font-size='26' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>규칙은 기관의 것이</text><text x='1340.0' y='172.76' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니라 좌표의 것이다</text><text x='1340.0' y='207.07999999999998' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1340.0' y='241.4' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>실행일수 · 현금흐름 ·</text><text x='1340.0' y='275.72' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>비유동 비중 · 위험한도</text><text x='1340.0' y='310.03999999999996' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>네 지표가 규칙을 정한다</text><text x='1340.0' y='344.36' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1340.0' y='378.68' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>안 A(단일 규칙)는</text><text x='1340.0' y='413.0' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>KIC 에서 DR 을 버리고</text><text x='1340.0' y='447.32' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>H대에서 위험을 못 지키며</text><text x='1340.0' y='481.64' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>국부펀드에는 적용이 안 된다</text><text x='1340.0' y='515.96' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1340.0' y='550.28' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>안 C(자율)는 규칙이 없다</text></svg>