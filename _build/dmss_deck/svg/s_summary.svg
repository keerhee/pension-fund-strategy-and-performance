<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="520" fill="#F7F5F0"/><rect x="5" y="20" width="290" height="220" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="150" y="105" font-family="Pretendard" font-size="36" font-weight="700" fill="#0B6B68" text-anchor="middle">① 목표 언어</text><text x="150" y="180" font-family="Pretendard" font-size="34" font-weight="700" fill="#102027" text-anchor="middle">계정마다 (H, α)</text><line x1="298" y1="130" x2="324" y2="130" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="327" y="20" width="290" height="220" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="472" y="105" font-family="Pretendard" font-size="36" font-weight="700" fill="#0B6B68" text-anchor="middle">② 분위수 조건</text><text x="472" y="180" font-family="Pretendard" font-size="34" font-weight="700" fill="#102027" text-anchor="middle">m − zσ ≥ H</text><line x1="620" y1="130" x2="646" y2="130" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="649" y="20" width="290" height="220" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="794" y="105" font-family="Pretendard" font-size="36" font-weight="700" fill="#0B6B68" text-anchor="middle">③ 내재 γ</text><text x="794" y="180" font-family="Pretendard" font-size="34" font-weight="700" fill="#102027" text-anchor="middle">식 (7) 풀기</text><line x1="942" y1="130" x2="968" y2="130" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="971" y="20" width="290" height="220" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="1116" y="105" font-family="Pretendard" font-size="36" font-weight="700" fill="#0B6B68" text-anchor="middle">④ 계정 비중</text><text x="1116" y="180" font-family="Pretendard" font-size="34" font-weight="700" fill="#102027" text-anchor="middle">g + v / γ</text><line x1="1264" y1="130" x2="1290" y2="130" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="1293" y="20" width="290" height="220" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><text x="1438" y="105" font-family="Pretendard" font-size="36" font-weight="700" fill="#071A1D" text-anchor="middle">⑤ 합산</text><text x="1438" y="180" font-family="Pretendard" font-size="34" font-weight="700" fill="#102027" text-anchor="middle">1/γ 가중평균</text><rect x="5" y="285" width="520" height="220" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="265" y="370" font-family="Pretendard" font-size="36" font-weight="700" fill="#B7F34A" text-anchor="middle">가능성 점검</text><text x="265" y="445" font-family="Pretendard" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">α 5%면 H ≤ −2.31%</text><rect x="540" y="285" width="520" height="220" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="800" y="370" font-family="Pretendard" font-size="36" font-weight="700" fill="#64757D" text-anchor="middle">롱온리 (계정별)</text><text x="800" y="445" font-family="Pretendard" font-size="36" font-weight="700" fill="#102027" text-anchor="middle">연 12bp 손실</text><rect x="1075" y="285" width="520" height="220" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="1335" y="370" font-family="Pretendard" font-size="36" font-weight="700" fill="#64757D" text-anchor="middle">γ 오지정 ±20%</text><text x="1335" y="445" font-family="Pretendard" font-size="36" font-weight="700" fill="#102027" text-anchor="middle">연 11 ~ 47bp 손실</text></svg>