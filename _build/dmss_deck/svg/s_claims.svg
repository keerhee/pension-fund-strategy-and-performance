<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="560" fill="#F7F5F0"/><rect x="30" y="40" width="480" height="480" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="270" y="120" font-family="Pretendard" font-size="40" font-weight="700" fill="#0B6B68" text-anchor="middle">① 문제 동치</text><text x="270" y="240" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">(H, α) 제약 최대화 =</text><text x="270" y="320" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">평균-분산 + 내재 γ</text><text x="270" y="400" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">= VaR 제약 = Telser형</text><line x1="518" y1="280" x2="552" y2="280" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="560" y="40" width="480" height="480" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="800" y="120" font-family="Pretendard" font-size="40" font-weight="700" fill="#0B6B68" text-anchor="middle">② 합쳐도 효율</text><text x="800" y="240" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">계정 해가 모두 효율선 위</text><text x="800" y="320" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">공매도 허용이면</text><text x="800" y="400" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">합산도 효율선 위</text><line x1="1048" y1="280" x2="1082" y2="280" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="1090" y="40" width="480" height="480" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><text x="1330" y="120" font-family="Pretendard" font-size="40" font-weight="700" fill="#071A1D" text-anchor="middle">③ 마찰은 작다</text><text x="1330" y="240" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">공매도 금지 손실 수 bp</text><text x="1330" y="320" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">γ 오지정 손실보다 작다</text><text x="1330" y="400" font-family="Pretendard" font-size="32" font-weight="400" fill="#102027" text-anchor="middle">샤프비율 손실 &lt; 6%</text></svg>