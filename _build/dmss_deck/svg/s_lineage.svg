<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="600" fill="#F7F5F0"/><rect x="560" y="30" width="480" height="120" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="800" y="82" font-family="Pretendard" font-size="36" font-weight="700" fill="#B7F34A" text-anchor="middle">Roy (1952) 안전우선</text><text x="800" y="132" font-family="Pretendard" font-size="32" font-weight="400" fill="#FFFFFF" text-anchor="middle">미달 확률을 가장 작게</text><line x1="700" y1="155" x2="380" y2="230" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><line x1="900" y1="155" x2="1220" y2="230" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="60" y="240" width="640" height="220" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="380" y="300" font-family="Pretendard" font-size="36" font-weight="700" fill="#64757D" text-anchor="middle">Kataoka (1963)형 — M8 방법 1</text><text x="380" y="365" font-family="Pretendard" font-size="34" font-weight="400" fill="#102027" text-anchor="middle">미달 확률 고정 → 하위 경계 최대</text><text x="380" y="420" font-family="Pretendard" font-size="34" font-weight="400" fill="#102027" text-anchor="middle">목표 G · 시점 T · 확률 p → K</text><rect x="900" y="240" width="640" height="220" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><text x="1220" y="300" font-family="Pretendard" font-size="36" font-weight="700" fill="#071A1D" text-anchor="middle">Telser (1956)형 — M8 방법 2</text><text x="1220" y="365" font-family="Pretendard" font-size="34" font-weight="400" fill="#071A1D" text-anchor="middle">미달 확률 한도 → 기대수익 최대</text><text x="1220" y="420" font-family="Pretendard" font-size="34" font-weight="700" fill="#071A1D" text-anchor="middle">Das–Markowitz: (H, α) → γ</text><text x="800" y="545" font-family="Pretendard" font-size="36" font-weight="700"