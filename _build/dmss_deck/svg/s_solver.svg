<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1800" height="780" fill="#F7F5F0"/><text x="20" y="44" font-family="Pretendard" font-size="30" font-weight="700" fill="#0B6B68" text-anchor="start" xml:space="preserve">① 시트 배치 — 상속 계정(H −15%, α 20%)</text><rect x="20" y="66" width="990" height="50" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="34" y="100" font-family="Pretendard" font-size="26" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">셀</text><text x="154" y="100" font-family="Pretendard" font-size="26" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">내용 · 수식</text><text x="794" y="100" font-family="Pretendard" font-size="26" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">값</text><rect x="20" y="116" width="990" height="50" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="150" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B2:B4</text><text x="154" y="150" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">비중 w (변수 셀)</text><text x="794" y="150" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">0 · 8.9 · 91.1%</text><rect x="20" y="166" width="990" height="50" rx="0" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="200" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">C2:C4</text><text x="154" y="200" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">기대수익 μ</text><text x="794" y="200" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">5% · 10% · 25%</text><rect x="20" y="216" width="990" height="50" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="250" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">E2:G4</text><text x="154" y="250" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">공분산 Σ (3 × 3)</text><text x="794" y="250" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">원문 가상 자산 값</text><rect x="20" y="266" width="990" height="50" rx="0" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="300" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B6</text><text x="154" y="300" font-family="Menlo" font-size="23" font-weight="400" fill="#0B6B68" text-anchor="start" xml:space="preserve">=SUM(B2:B4)</text><text x="794" y="300" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">1</text><rect x="20" y="316" width="990" height="50" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="350" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B7</text><text x="154" y="350" font-family="Menlo" font-size="23" font-weight="400" fill="#0B6B68" text-anchor="start" xml:space="preserve">=SUMPRODUCT(B2:B4,C2:C4)</text><text x="794" y="350" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">23.67%</text><rect x="20" y="366" width="990" height="50" rx="0" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="400" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B8</text><text x="154" y="400" font-family="Menlo" font-size="23" font-weight="400" fill="#0B6B68" text-anchor="start" xml:space="preserve">=MMULT(TRANSPOSE(B2:B4),MMULT(E2:G4,B2:B4))</text><text x="794" y="400" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">0.2111</text><rect x="20" y="416" width="990" height="50" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="450" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B9</text><text x="154" y="450" font-family="Menlo" font-size="23" font-weight="400" fill="#0B6B68" text-anchor="start" xml:space="preserve">=SQRT(B8)</text><text x="794" y="450" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">45.94%</text><rect x="20" y="466" width="990" height="50" rx="0" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="500" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B10</text><text x="154" y="500" font-family="Menlo" font-size="23" font-weight="400" fill="#0B6B68" text-anchor="start" xml:space="preserve">=B7-NORM.S.INV(0.8)*B9</text><text x="794" y="500" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">−15.00%</text><rect x="20" y="516" width="990" height="50" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="34" y="550" font-family="Pretendard" font-size="26" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">B11</text><text x="154" y="550" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">H (문턱)</text><text x="794" y="550" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">−15%</text><rect x="1050" y="20" width="730" height="500" rx="8" fill="#FFFFFF" stroke="#9FB0B2" stroke-width="3"/><rect x="1050" y="20" width="730" height="52" rx="8" fill="#E8ECEC"/><text x="1074" y="56" font-family="Pretendard" font-size="28" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">해 찾기 매개 변수</text><text x="1078" y="122" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">목표 설정:</text><rect x="1350" y="92" width="300" height="42" rx="0" fill="#FFFFFF" stroke="#9FB0B2" stroke-width="2"/><text x="1364" y="122" font-family="Menlo" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">$B$7</text><text x="1078" y="178" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">대상:</text><circle cx="1222" cy="169" r="11" fill="none" stroke="#0B6B68" stroke-width="3"/><circle cx="1222" cy="169" r="5" fill="#0B6B68"/><text x="1242" y="178" font-family="Pretendard" font-size="25" font-weight="700" fill="#0B6B68" text-anchor="start" xml:space="preserve">최대값</text><circle cx="1360" cy="169" r="11" fill="none" stroke="#64757D" stroke-width="3"/><text x="1380" y="178" font-family="Pretendard" font-size="25" font-weight="400" fill="#64757D" text-anchor="start" xml:space="preserve">최소</text><circle cx="1470" cy="169" r="11" fill="none" stroke="#64757D" stroke-width="3"/><text x="1490" y="178" font-family="Pretendard" font-size="25" font-weight="400" fill="#64757D" text-anchor="start" xml:space="preserve">지정값</text><text x="1078" y="230" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">변수 셀 변경:</text><rect x="1350" y="200" width="300" height="42" rx="0" fill="#FFFFFF" stroke="#9FB0B2" stroke-width="2"/><text x="1364" y="230" font-family="Menlo" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">$B$2:$B$4</text><text x="1078" y="288" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">제한 조건에 종속:</text><rect x="1078" y="300" width="674" height="76" rx="0" fill="#FFFFFF" stroke="#9FB0B2" stroke-width="2"/><text x="1094" y="330" font-family="Menlo" font-size="24" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">$B$6 = 1</text><text x="1094" y="364" font-family="Menlo" font-size="24" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">$B$10 &gt;= $B$11</text><rect x="1072" y="390" width="686" height="46" rx="4" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><rect x="1090" y="401" width="24" height="24" rx="0" fill="#FFFFFF" stroke="#102027" stroke-width="3"/><path d="M1094,413 L1101,421 L1111,405" fill="none" stroke="#102027" stroke-width="4"/><text x="1128" y="422" font-family="Pretendard" font-size="25" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">제한되지 않는 변수를 음이 아닌 수로 설정  ← 롱온리</text><text x="1078" y="482" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">해법 선택:</text><rect x="1250" y="452" width="260" height="42" rx="0" fill="#FFFFFF" stroke="#9FB0B2" stroke-width="2"/><text x="1264" y="482" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">GRG 비선형</text><rect x="1610" y="452" width="140" height="42" rx="4" fill="#0B6B68" stroke="#0B6B68" stroke-width="2"/><text x="1680" y="482" font-family="Pretendard" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">해 찾기</text><rect x="1050" y="540" width="730" height="104" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="1074" y="580" font-family="Pretendard" font-size="25" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">체크 끔(공매도 허용) → −78.9 · 96.2 · 82.7%, 기대 26.35%</text><text x="1074" y="624" font-family="Pretendard" font-size="25" font-weight="700" fill="#0B6B68" text-anchor="start" xml:space="preserve">체크 켬(롱온리) → 0 · 8.9 · 91.1%, 기대 23.67%</text><rect x="20" y="580" width="1010" height="186" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="40" y="620" font-family="Menlo" font-size="21" font-weight="400" fill="#B7F34A" text-anchor="start" xml:space="preserve">from scipy.optimize import minimize</text><text x="40" y="654" font-family="Menlo" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">c = [{'type': 'eq', 'fun': lambda w: w.sum() - 1},</text><text x="40" y="688" font-family="Menlo" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">     {'type': 'ineq', 'fun': lambda w: w@mu - 0.8416*np.sqrt(w@S@w) + 0.15}]</text><text x="40" y="722" font-family="Menlo" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">r = minimize(lambda w: -w@mu, [1/3]*3, method='SLSQP',</text><text x="40" y="756" font-family="Menlo" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">             bounds=[(0, 1)]*3, constraints=c)   # r.x → 0, 0.089, 0.911</text><text x="1050" y="690" font-family="Pretendard" font-size="24" font-weight="700" fill="#64757D" text-anchor="start" xml:space="preserve">② 해 찾기 대화창 · ③ 같은 문제를 파이썬으로(왼쪽 아래)</text><text x="1050" y="730" font-family="Pretendard" font-size="24" font-weight="700" fill="#64757D" text-anchor="start" xml:space="preserve">bounds = (0, 1)이 엑셀의 ‘음이 아닌 수’ 체크와 같다</text></svg>