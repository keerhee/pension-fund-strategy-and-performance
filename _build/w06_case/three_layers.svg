<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='480' height='560' rx='12' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='280' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>1교시 · 시간분산</text><text x='280' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>같은 σ, 두 자</text><text x='280' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>연환산 σ/√T 는 줄고</text><text x='280' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>누적 σ√T 는 는다</text><text x='280' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 기금이 크면 '금액'이 문제</text><text x='280' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(조건 ③)</text><text x='280' y='560' text-anchor='middle' font-size='26' fill='#2E5BAA' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>제1호 조건 ③</text><rect x='560' y='40' width='480' height='560' rx='12' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='800' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>2교시 · 인적자본</text><text x='800' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>BMS 1992 의 기관판</text><text x='800' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>H = 향후 30년 보험료 PV</text><text x='800' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>H/F 가 내려가면</text><text x='800' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>총부 위험비중이 올라간다</text><text x='800' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(조건 ① 트리거)</text><text x='800' y='560' text-anchor='middle' font-size='26' fill='#3FA36F' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>제1호 조건 ①</text><rect x='1080' y='40' width='480' height='560' rx='12' fill='#F4F5F9' stroke='#6B7280' stroke-width='2'/><text x='1320' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>1교시 · ICAPM</text><text x='1320' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>내일의 기회를 산다</text><text x='1320' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>헤징 수요 = (1−1/γ)·β·σx/σa</text><text x='1320' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예측력 t ≥ 2 인 상태변수만</text><text x='1320' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>비용 ≤ 30bp</text><text x='1320' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(제2호 조건 ①~③)</text><text x='1320' y='560' text-anchor='middle' font-size='26' fill='#1B2C5E' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>제2호 조건 ①~③</text></svg>