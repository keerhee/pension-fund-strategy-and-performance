<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='560' height='110' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='86.0' text-anchor='middle' font-size='30' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ① H/F ≥ 0.625 인가?</text><text x='320.0' y='125.6' text-anchor='middle' font-size='30' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(향후 30년 보험료 PV ÷ 기금)</text><line x1='600' y1='95' x2='700' y2='95' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='75' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예</text><rect x='700' y='40' width='420' height='110' rx='10' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='910.0' y='86.9' text-anchor='middle' font-size='27' font-weight='700' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>지금 감축 근거 없음 (2026~41)</text><text x='910.0' y='122.54' text-anchor='middle' font-size='27' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>총부 위험비중 30~39%</text><line x1='320' y1='150' x2='320' y2='220' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='430' y='195' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오 · 2042부터</text><rect x='40' y='220' width='560' height='110' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='266.0' text-anchor='middle' font-size='30' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ② 종점 w ≥ w_h = 50% 인가?</text><text x='320.0' y='305.6' text-anchor='middle' font-size='30' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(μ ≥ 5.5%, 연금개혁 전제)</text><line x1='600' y1='275' x2='700' y2='275' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='250' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오</text><rect x='700' y='220' width='420' height='110' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='910.0' y='266.59999999999997' text-anchor='middle' font-size='28' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 — 안 C(종점 45%)</text><text x='910.0' y='303.55999999999995' text-anchor='middle' font-size='28' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>μ 5.25% &lt; 5.5%</text><line x1='320' y1='330' x2='320' y2='400' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='350' y='372' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예</text><rect x='40' y='400' width='560' height='110' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='446.0' text-anchor='middle' font-size='30' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ③ L_t ≤ 1년치 · ④ 소진 ≥ 2071</text><text x='320.0' y='485.6' text-anchor='middle' font-size='30' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>· ⑤ 버퍼 ≥ 급여 1.5년치</text><line x1='600' y1='455' x2='700' y2='455' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='430' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오</text><rect x='700' y='400' width='420' height='110' rx='10' fill='#FBEAEA' stroke='#B2