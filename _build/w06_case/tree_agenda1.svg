.0' y='308.12' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>③④⑤가 경로의</text><text x='1360.0' y='345.08000000000004' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>안전성을 정한다</text><text x='1360.0' y='382.03999999999996' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1360.0' y='419.0' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>C는 ①②에서,</text><text x='1360.0' y='455.96000000000004' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>A는 ③⑤에서 탈락</text><text x='1360.0' y='492.91999999999996' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1360.0' y='529.88' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 남는 답은 B</text></svg>