<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='480' height='560' rx='12' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='280' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Safety 버킷 (≥ 95%)</text><text x='280' y='155' text-anchor='middle' font-size='27' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>은퇴 시 원금 + 연 1% = G_S 1.10</text><text x='280' y='245' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Floor = x · G_S · P(t,T)</text><text x='280' y='313' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>GHP(만기 매칭 국채)로 복제</text><text x='280' y='381' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 조건 ① 목표 미달 ≤ 5%</text><text x='280' y='449' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 조건 ④ 2022형 Floor 위반 ≤ 1%</text><text x='280' y='560' text-anchor='middle' font-size='26' fill='#3FA36F' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>강의 1교시 · 2교시</text><rect x='560' y='40' width='480' height='560' rx='12' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='800' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Market 버킷 (≥ 70%)</text><text x='800' y='155' text-anchor='middle' font-size='27' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>원리금보장 3.09% 10년 = G_M 1.356</text><text x='800' y='245' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>쿠션 C = W − F 에 m 배 PSP</text><text x='800' y='313' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>수수료가 쿠션에서 나간다</text><text x='800' y='381' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 조건 ③ P(W_T ≥ G_M) ≥ 70%</text><text x='800' y='449' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(수수료 상한을 정한다)</text><text x='800' y='560' text-anchor='middle' font-size='26' fill='#2E5BAA' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>강의 3교시 (비용 0.8~1.5%)</text><rect x='1080' y='40' width='480' height='560' rx='12' fill='#F4F5F9' stroke='#6B7280' stroke-width='2'/><text x='1320' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Cash Trap (실무의 함정)</text><text x='1320' y='155' text-anchor='middle' font-size='27' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>쿠션 소진 → PSP 0% 락인</text><text x='1320' y='245' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>분기 리밸런싱: 1/m 손실에 깨짐</text><text x='1320' y='313' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>m=2 50% · m=3 33% · m=6 17%</text><text x='1320' y='381' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 조건 ② Cash Trap ≤ 10%</text><text x='1320' y='449' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 조건 ⑤ '보장' 금지 · 재심</text><text x='1320' y='560' text-anchor='middle' font-size='26' fill='#1B2C5E' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>강의 2교시 (CPPI 의 한계)</text></svg>