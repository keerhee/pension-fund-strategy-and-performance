<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='740' height='80' rx='10' fill='#1B2C5E' stroke='#1B2C5E' stroke-width='2'/><text x='410.0' y='91.52' text-anchor='middle' font-size='32' font-weight='700' fill='white' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Floor = GHP 가격 (금리 연동)</text><rect x='820' y='40' width='740' height='80' rx='10' fill='#B23A48' stroke='#B23A48' stroke-width='2'/><text x='1190.0' y='91.52' text-anchor='middle' font-size='32' font-weight='700' fill='white' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Floor = 고정 명목 원금</text><rect x='40' y='140' width='740' height='200' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='410.0' y='213.12' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>금리 +300bp → 만기 매칭 국채 −21%</text><text x='410.0' y='250.08' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Floor 도 같은 만큼 내려간다 (P(t,T) 하락)</text><text x='410.0' y='287.04' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 쿠션 불변 · 위반 0% · '만기에 x·G_S' 는 그대로</text><rect x='820' y='140' width='740' height='200' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='1190.0' y='213.12' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>금리 +300bp → 국채 −21%, Floor 는 그대로</text><text x='1190.0' y='250.08' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ x 1.00 이면 위반 100% · 쿠션 음수 · 즉시 락인</text><text x='1190.0' y='287.04' text-anchor='middle' font-size='28' font-weight='400' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>'원금 보장' 이라 부르려면 보험사 자본이 필요하다</text><rect x='40' y='370' width='740' height='230' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='410.0' y='441.26' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>무엇을 약속하는가</text><text x='410.0' y='476.9' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>"은퇴 시점에 Safety 목표의 90% 를 확보하도록</text><text x='410.0' y='512.54' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>국채로 매칭해 운용한다" — 목표 언어</text><text x='410.0' y='548.18' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>법령상 '원리금보장상품'이 아니다 → 조건 ⑤</text><rect x='820' y='370' width='740' height='230' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='1190.0' y='441.26' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>무엇을 약속하는가</text><text x='1190.0' y='476.9' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>"원금을 보장한다" — 수익률 언어</text><text x='1190.0' y='512.54' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>지급 능력이 있는 자만 쓸 수 있는 말</text><text x='1190.0' y='548.18' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>디폴트옵션 안정형(원리금보장 85.4%)의 언어</text></svg>