' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>③이 Floor 의 상한과</text><text x='1362.5' y='288.76' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>수수료 상한을,</text><text x='1362.5' y='324.4' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>②④가 승수 상한을</text><text x='1362.5' y='360.03999999999996' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>정한다</text><text x='1362.5' y='395.68' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1362.5' y='431.32' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x=1.00 은 ③에서,</text><text x='1362.5' y='466.96' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x=0.80 은 ①에서,</text><text x='1362.5' y='502.59999999999997' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>m≥3 은 ①②④에서</text><text x='1362.5' y='538.24' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 → 남는 답은 하나</text></svg>