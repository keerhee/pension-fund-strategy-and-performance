<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='520' height='105' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='300.0' y='84.1' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ① 락업 생존 연수 ≥ 10 인 x 는?</text><text x='300.0' y='121.06' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(2022형 + 목돈 600억 + 캐피탈콜)</text><line x1='560' y1='92' x2='730' y2='92' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='645' y='72' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x ≥ 30</text><rect x='730' y='40' width='400' height='105' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='930.0' y='84.7' text-anchor='middle' font-size='26' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 — 30%: 9년 · 60%: 2년</text><text x='930.0' y='119.02000000000001' text-anchor='middle' font-size='26' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Yale 형(60%)은 2년 만에 매도</text><line x1='300' y1='145' x2='300' y2='205' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='460' y='182' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x ≤ 20 (13년 이상)</text><rect x='40' y='205' width='520' height='105' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='300.0' y='249.10000000000002' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ② 실질가치 유지 ≥ 50% 인 z 는?</text><text x='300.0' y='286.06' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>(세대 간 중립 · z ≥ 현행 4.0%)</text><line x1='560' y1='257' x2='730' y2='257' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='645' y='237' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>z = 5.25</text><rect x='730' y='205' width='400' height='105' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='930.0' y='249.4' text-anchor='middle' font-size='27' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 — Yale 의 5.25% 는 46%</text><text x='930.0' y='285.04' text-anchor='middle' font-size='27' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x = 0 이면 4.0% 까지만</text><line x1='300' y1='310' x2='300' y2='370' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='470' y='347' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>x = 20 · z ≤ 4.5 (59%)</text><rect x='40' y='370' width='520' height='105' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='300.0' y='414.4' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ④ 3년 지출 유지 ≥ 95% 인 y 는?</text><text x='300.0' y='450.03999999999996' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ③ 직접 PE·VC 요건(인력 3 · 매니저 15)?</text><line x1='560' y1='422' x2='730' y2='422' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='645' y='402' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>y ≤ 25</text><rect x='730' y='370' width='400' height='105' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='930.0' y='415.0' text-anchor='middle' font-size='25' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>y = 25%: 14% · 20%: 0% → 탈락</text><text x='930.0' y='448.0' text-anchor='middle' font-size='25' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>직접 PE·VC 불가 → 펀드오브펀드</text><line x1='300' y1='475' x2='300' y2='535' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='360' y='522' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>y ≥ 30</text><rect x='40' y='535' width='1090' height='90' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='585.0' y='571.9' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>기본 답 — 비유동 대체 상한 20%(펀드오브펀드 · 세컨더리) · 안전 유동자산 하한 30% · 지출률 4.5%</text><text x='585.0' y='607.54' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>80/20 평활 · 고정 지출 3.5% Floor · 조건 ⑤ 분모 효과 시 신규 약정 중단 — 조건부 승인</text><rect x='1165' y='40' width='395' height='585' rx='10' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='1362.5' y='146.2' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Yale 모델은 방향이 아니라</text><text x='1362.5' y='181.83999999999997' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>네 숫자의 문제다</text><text x='1362.5' y='217.48' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1362.5' y='253.12' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>①이 x 의 상한을,</text><text x='1362.5' y='288.76' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>②가 z 의 상한을,</text><text x='1362.5' y='324.4' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>④가 y 의 하한을,</text><text x='1362.5' y='360.03999999999996' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>③이 대체의 형태를</text><text x='1362.5' y='395.68' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>정한다</text><text x='1362.5' y='431.32' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1362.5' y='466.96' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>Yale 형(60 · 5.25)은</text><text x='1362.5' y='502.59999999999997' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>①②에서, GPFG 형(0)은</text><text x='1362.5' y='538.24' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>②에서 4.0% 로 묶인다</text></svg>