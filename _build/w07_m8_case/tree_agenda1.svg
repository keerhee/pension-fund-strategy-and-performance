<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='30' width='560' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='71.6' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ① 갭 실재 + 부채 지표(LBP)가 있는가?</text><text x='320.0' y='108.56' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>−100bp → FR_g 69% → 49% (임계 −5%p)</text><line x1='600' y1='80' x2='700' y2='80' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='60' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>지표 없음</text><rect x='700' y='30' width='420' height='100' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='910.0' y='71.6' text-anchor='middle' font-size='28' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 — 안 A(현행)</text><text x='910.0' y='108.56' text-anchor='middle' font-size='28' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>확인된 갭을 재지도 않는다</text><line x1='320' y1='130' x2='320' y2='190' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='440' y='170' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예 · 안 B · 안 C</text><rect x='40' y='190' width='560' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='231.60000000000002' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ② 시장이 받아 주는가?</text><text x='320.0' y='268.56' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>현물 ≤ 장기물 발행 30%×5년 · IRS ≤ 연 거래 5%</text><line x1='600' y1='240' x2='700' y2='240' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='220' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>아니오</text><rect x='700' y='190' width='420' height='100' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='910.0' y='231.60000000000002' text-anchor='middle' font-size='28' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락 — 안 C(IRS 명목 1,223조)</text><text x='910.0' y='268.56' text-anchor='middle' font-size='28' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>상한 299조의 4.1배</text><line x1='320' y1='290' x2='320' y2='350' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='400' y='332' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예 · 안 B</text><rect x='40' y='350' width='560' height='100' rx='10' fill='#F4F5F9' stroke='#D6D6DB' stroke-width='2'/><text x='320.0' y='391.59999999999997' text-anchor='middle' font-size='28' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ③ 버퍼 · ④ 허들 · ⑤ 지침</text><text x='320.0' y='428.55999999999995' text-anchor='middle' font-size='28' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>증거금 ≤ 유동자산 · μ ≥ 5.5% · 별표 1 · 파생 조항</text><line x1='600' y1='400' x2='700' y2='400' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='650' y='380' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>C 는 여기서도</text><rect x='700' y='350' width='420' height='100' rx='10' fill='#FBEAEA' stroke='#B23A48' stroke-width='2'/><text x='910.0' y='392.2' text-anchor='middle' font-size='26' font-weight='700' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>C — 증거금 401조 &gt; 유동자산 123조</text><text x='910.0' y='426.52' text-anchor='middle' font-size='26' font-weight='400' fill='#B23A48' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>지침에 파생 조항 없음</text><line x1='320' y1='450' x2='320' y2='520' stroke='#6B7280' stroke-width='3' marker-end='url(#ah)'/><text x='350' y='505' text-anchor='middle' font-size='26' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>예</text><rect x='40' y='520' width='1080' height='100' rx='10' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='580.0' y='562.2' text-anchor='middle' font-size='26' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>기본 답 — 안 B: LBP 도입 + 헤지 5%(현물 30년 131조 · 5년) 조건부 승인</text><text x='580.0' y='596.5200000000001' text-anchor='middle' font-size='26' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>갭 -33년 · μ 6.94% · 증거금 0 · 남는 갭의 부담자를 의결문에 적는다</text><rect x='1160' y='30' width='400' height='590' rx='10' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='1360.0' y='138.7' text-anchor='middle' font-size='27' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건은 순서가 있다</text><text x='1360.0' y='174.33999999999997' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1360.0' y='209.98' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>①이 '헤지할 갭이 있는가'를,</text><text x='1360.0' y='245.62' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>②가 '얼마까지 가능한가'를,</text><text x='1360.0' y='281.26' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>③④⑤가 '그 수단이 안전·</text><text x='1360.0' y='316.9' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>합법한가'를 정한다</text><text x='1360.0' y='352.53999999999996' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1360.0' y='388.18' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>A 는 ①에서, C 는 ②③⑤에서</text><text x='1360.0' y='423.82' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>탈락한다</text><text x='1360.0' y='459.46' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'></text><text x='1360.0' y='495.09999999999997' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 남는 답은 B, 그리고</text><text x='1360.0' y='530.74' text-anchor='middle' font-size='27' font-weight='400' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>B 의 크기는 시장이 정한다</text></svg>