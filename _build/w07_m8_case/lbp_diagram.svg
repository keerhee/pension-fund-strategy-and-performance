<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1600' height='640' fill='white'/><rect x='40' y='40' width='480' height='560' rx='12' fill='#EAF1FB' stroke='#2E5BAA' stroke-width='2'/><text x='280' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>① 현금흐름 스케줄</text><text x='280' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>연도별 순유출 B_t − C_t</text><text x='280' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>2026~2071 · 교육용 추계</text><text x='280' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>순유출 전환 2037</text><text x='280' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>정점·소진은 2025 재정추계에 맞춤</text><text x='280' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 매년 갱신(재정추계 주기)</text><text x='280' y='560' text-anchor='middle' font-size='26' fill='#2E5BAA' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>안건서 조건 ① 의 입력</text><rect x='560' y='40' width='480' height='560' rx='12' fill='#E6F5F0' stroke='#3FA36F' stroke-width='2'/><text x='800' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>② 할인 곡선</text><text x='800' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>국고채 곡선 = 시장 눈금</text><text x='800' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>자체 5.5% 는 목표, 국채는 가격</text><text x='800' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>FR_h 95% vs FR_g 69%</text><text x='800' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>두 숫자를 나란히 공시</text><text x='800' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 할인율 층위를 섞지 않는다</text><text x='800' y='560' text-anchor='middle' font-size='26' fill='#3FA36F' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ① 의 판정 눈금</text><rect x='1080' y='40' width='480' height='560' rx='12' fill='#F4F5F9' stroke='#6B7280' stroke-width='2'/><text x='1320' y='105' text-anchor='middle' font-size='34' font-weight='700' fill='#1B2C5E' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>③ 민감도 프로파일</text><text x='1320' y='155' text-anchor='middle' font-size='28' fill='#6B7280' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>키레이트 DV01 · 갭 · 헤지 비율</text><text x='1320' y='240' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>DV01_L 7.4조/bp</text><text x='1320' y='302' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>갭 -34년 · 헤지 비율 2%</text><text x='1320' y='364' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>30년 구간에 민감도 집중</text><text x='1320' y='426' text-anchor='middle' font-size='30' fill='#3B4252' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>→ 헤지 수단·크기의 근거</text><text x='1320' y='560' text-anchor='middle' font-size='26' fill='#1B2C5E' font-weight='700' font-family='Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif'>조건 ②·③ 의 입력</text></svg>