<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="210" viewBox="0 0 1160 210" font-family="Noto Sans CJK KR"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2C5E"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker></defs><rect width="1160" height="210" fill="white"/><rect x="10" y="60" width="230" height="90" rx="10" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="125" y="98" font-size="21.3" fill="#1B2C5E" font-weight="bold" text-anchor="middle">10년 금리 하락</text><text x="125" y="128" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">상태변수 x가 움직인다</text><line x1="245" y1="85" x2="330" y2="45" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><line x1="245" y1="125" x2="330" y2="165" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><rect x="335" y="5" width="380" height="80" rx="10" fill="#FBEAEA" stroke="#C0392B" stroke-width="2"/><text x="525" y="38" font-size="19.0" fill="#C0392B" font-weight="bold" text-anchor="middle">앞으로 재투자 수익이 낮아진다</text><text x="525" y="66" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">미래 투자 기회 악화 (b &gt; 0)</text><rect x="335" y="125" width="380" height="80" rx="10" fill="#E6F5F0" stroke="#2E9E6B" stroke-width="2"/><text x="525" y="158" font-size="19.0" fill="#2E9E6B" font-weight="bold" text-anchor="middle">바로 그때 장기 국채 값이 오른다</text><text x="525" y="186" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">헤지 자산과 x의 상관 ρ &lt; 0</text><line x1="720" y1="45" x2="800" y2="95" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><line x1="720" y1="165" x2="800" y2="115" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><rect x="805" y="50" width="345" height="110" rx="10" fill="#FCEBD9" stroke="#E8A04C" stroke-width="2"/><text x="977" y="88" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">장기 국채 = 나쁜 미래에</text><text x="977" y="115" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">돈을 주는 보험</text><text x="977" y="143" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">→ 단기 최적보다 더 담는다 (γ &gt; 1)</text></svg>