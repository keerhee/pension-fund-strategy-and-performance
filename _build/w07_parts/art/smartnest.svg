<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="250" viewBox="0 0 1160 250" font-family="Noto Sans CJK KR"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2C5E"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker></defs><rect width="1160" height="250" fill="white"/><rect x="10" y="40" width="280" height="170" rx="10" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="150" y="72" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">입력 — 사람마다 다르다</text><text x="150" y="110" font-size="17.4" fill="#374151" font-weight="normal" text-anchor="middle">희망 은퇴 소득 · 최소 소득</text><text x="150" y="142" font-size="17.4" fill="#374151" font-weight="normal" text-anchor="middle">다른 소득원(공적연금 · DB)</text><text x="150" y="174" font-size="17.4" fill="#374151" font-weight="normal" text-anchor="middle">현재 급여 · 급여 변화</text><line x1="295" y1="125" x2="360" y2="125" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><rect x="365" y="55" width="300" height="140" rx="10" fill="#FCEBD9" stroke="#E8A04C" stroke-width="2"/><text x="515" y="92" font-size="19.0" fill="#1B2C5E" font-weight="bold" text-anchor="middle">목표 = 은퇴 후 실질 연금 소득</text><text x="515" y="128" font-size="17.4" fill="#374151" font-weight="normal" text-anchor="middle">그 소득을 사는 값 = 개인의 ‘부채’</text><text x="515" y="160" font-size="15.7" fill="#9AA3AF" font-weight="normal" text-anchor="middle">(은퇴 날짜가 아니라 소득을 목표로)</text><line x1="670" y1="100" x2="760" y2="70" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><line x1="670" y1="150" x2="760" y2="180" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><rect x="765" y="25" width="385" height="90" rx="10" fill="#E6F5F0" stroke="#2E9E6B" stroke-width="2"/><text x="957" y="58" font-size="19.0" fill="#1B2C5E" font-weight="bold" text-anchor="middle">장기 TIPS — 부채 헤지</text><text x="957" y="90" font-size="16.2" fill="#374151" font-weight="normal" text-anchor="middle">은퇴가 가까울수록 늘린다 · 개인용 LDI</text><rect x="765" y="135" width="385" height="90" rx="10" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="957" y="168" font-size="19.0" fill="#1B2C5E" font-weight="bold" text-anchor="middle">글로벌 주식 — 희망 포트폴리오</text><text x="957" y="200" font-size="16.2" fill="#374151" font-weight="normal" text-anchor="middle">젊을 때 최대 98% · 위협받으면 CPPI로 보호</text><text x="580" y="240" font-size="16.8" fill="#1B2C5E" font-weight="normal" text-anchor="middle">TDF는 출생연도만 보고 같은 경로 — SmartNest는 소득 목표 · 다른 연금 · 급여로 사람마다 다른 경로</text></svg>