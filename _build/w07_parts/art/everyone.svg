<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" font-family="Noto Sans CJK KR"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2C5E"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker></defs><rect width="600" height="330" fill="white"/><rect x="15" y="30" width="250" height="220" rx="10" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><rect x="335" y="30" width="250" height="220" rx="10" fill="#FBEAEA" stroke="#C0392B" stroke-width="2"/><text x="140" y="62" font-size="23.5" fill="#1B2C5E" font-weight="bold" text-anchor="middle">오목한 전략</text><text x="140" y="88" font-size="16.8" fill="#374151" font-weight="normal" text-anchor="middle">내리면 산다 · 변동성 매도</text><text x="140" y="128" font-size="19.0" fill="#1B2C5E" font-weight="normal" text-anchor="middle">· 고정 비중 리밸런싱</text><text x="140" y="162" font-size="19.0" fill="#1B2C5E" font-weight="normal" text-anchor="middle">· 연기금 · 국부펀드</text><text x="140" y="196" font-size="19.0" fill="#1B2C5E" font-weight="normal" text-anchor="middle">· 가치 투자자</text><text x="460" y="62" font-size="23.5" fill="#C0392B" font-weight="bold" text-anchor="middle">볼록한 전략</text><text x="460" y="88" font-size="16.8" fill="#374151" font-weight="normal" text-anchor="middle">내리면 판다 · 변동성 매수</text><text x="460" y="128" font-size="19.0" fill="#C0392B" font-weight="normal" text-anchor="middle">· CPPI · 포트폴리오 보험</text><text x="460" y="162" font-size="19.0" fill="#C0392B" font-weight="normal" text-anchor="middle">· 추세추종(CTA)</text><text x="460" y="196" font-size="19.0" fill="#C0392B" font-weight="normal" text-anchor="middle">· 마진콜 · 손절 매도</text><line x1="268" y1="115" x2="330" y2="115" stroke="#2E9E6B" stroke-width="3" marker-end="url(#arg)"/><text x="300" y="105" font-size="15.7" fill="#2E9E6B" font-weight="bold" text-anchor="middle">산다</text><line x1="332" y1="180" x2="270" y2="180" stroke="#C0392B" stroke-width="3" marker-end="url(#arr)"/><text x="300" y="172" font-size="15.7" fill="#C0392B" font-weight="bold" text-anchor="middle">판다</text><text x="300" y="285" font-size="19.0" fill="#1B2C5E" font-weight="bold" text-anchor="middle">하락장 — 볼록한 쪽이 판 주식을 오목한 쪽이 받는다</text><text x="300" y="312" font-size="16.2" fill="#374151" font-weight="normal" text-anchor="middle">모두가 오목하면 거래 상대가 없다 → 가격이 대신 움직이고 보너스는 사라진다</text></svg>