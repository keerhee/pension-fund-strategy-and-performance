<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" font-family="Noto Sans CJK KR"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B2C5E"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker></defs><rect width="1160" height="330" fill="white"/><text x="140" y="28" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">① 지금 — 부 100</text><rect x="30" y="50" width="220" height="47.5" rx="4" fill="#E6F5F0" stroke="#2E9E6B" stroke-width="2"/><text x="140" y="79.75" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">잉여 25</text><rect x="30" y="97.5" width="220" height="142.5" rx="4" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="140" y="174.75" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">바닥 75 = TIPS</text><text x="140" y="264.0" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">연 소비 1.5 ÷ 실질금리 2% = 75</text><text x="440" y="28" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">② 주식 노출 = 2 × 잉여</text><rect x="330" y="50" width="220" height="95.0" rx="4" fill="#FCEBD9" stroke="#E8A04C" stroke-width="2"/><text x="440" y="103.5" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">주식 50 (잉여 25 + 차입 25)</text><rect x="330" y="145.0" width="220" height="142.5" rx="4" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="440" y="222.25" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">TIPS 75</text><text x="440" y="311.5" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">m = 2 — ‘레버리지 주식’</text><text x="740" y="28" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">③ 주가 반 토막</text><rect x="630" y="50" width="220" height="0.019" rx="4" fill="#E6F5F0" stroke="#2E9E6B" stroke-width="2"/><text x="740" y="56.0095" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle"></text><rect x="630" y="50.019" width="220" height="142.5" rx="4" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="740" y="127.269" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">TIPS 75 — 바닥은 그대로</text><text x="740" y="216.519" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">주식 25 − 차입 25 = 잉여 0 · 소비 1.5 유지</text><text x="1040" y="28" font-size="20.2" fill="#1B2C5E" font-weight="bold" text-anchor="middle">④ 주가 상승 → 톱니</text><rect x="930" y="50" width="220" height="57.0" rx="4" fill="#E6F5F0" stroke="#2E9E6B" stroke-width="2"/><text x="1040" y="84.5" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">잉여 30</text><rect x="930" y="107.0" width="220" height="171.0" rx="4" fill="#EAF1FB" stroke="#3B6FB6" stroke-width="2"/><text x="1040" y="198.5" font-size="16.8" fill="#1B2C5E" font-weight="bold" text-anchor="middle">새 바닥 90 (소비 1.8)</text><text x="1040" y="302.0" font-size="15.7" fill="#374151" font-weight="normal" text-anchor="middle">바닥 = 지금까지의 최고 소비(최댓값)</text><line x1="258" y1="150" x2="324" y2="150" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><line x1="558" y1="150" x2="624" y2="150" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/><line x1="858" y1="150" x2="924" y2="150" stroke="#1B2C5E" stroke-width="2.5" marker-end="url(#ar)"/></svg>