<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="620" fill="#F7F5F0"/><rect x="10" y="20" width="770" height="580" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="395" y="74" font-family="Pretendard" font-size="30" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">좋은 상태 — 목표 영역이 효율선과 겹친다</text><text x="50" y="150" font-family="Pretendard" font-size="30" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">선택 1</text><text x="170" y="150" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">목표 확률 최대 → 최적점</text><text x="50" y="230" font-family="Pretendard" font-size="30" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">선택 2</text><text x="170" y="230" font-family="Pretendard" font-size="26" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">확률 ≥ 목표 확률 안에서 기대수익 최대 → 상단 목표점</text><text x="50" y="310" font-family="Pretendard" font-size="30" font-weight="700" fill="#102027" text-anchor="start" xml:space="preserve">선택 3</text><text x="170" y="310" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">둘의 σ 평균 → 중간점</text><text x="50" y="420" font-family="Pretendard" font-size="29" font-weight="400" fill="#64757D" text-anchor="start" xml:space="preserve">손실 문턱점이 상단 목표점보다 왼쪽이면</text><text x="50" y="465" font-family="Pretendard" font-size="29" font-weight="700" fill="#0B6B68" text-anchor="start" xml:space="preserve">선택 2 · 3은 손실 문턱점에서 멈춘다</text><text x="50" y="545" font-family="Pretendard" font-size="28" font-weight="400" fill="#64757D" text-anchor="start" xml:space="preserve">원문 예: 최적점 σ 0.157 · 상단 0.424</text><rect x="820" y="20" width="770" height="580" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="1205" y="74" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="middle" xml:space="preserve">나쁜 상태 — 목표와 손실 문턱이 충돌</text><text x="860" y="150" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">선택 1</text><text x="980" y="150" font-family="Pretendard" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">목표 확률 최대 → 최적점(위험↑)</text><text x="860" y="230" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">선택 2</text><text x="980" y="230" font-family="Pretendard" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">손실 문턱 유지 → 문턱점(위험↓)</text><text x="860" y="310" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">선택 3</text><text x="980" y="310" font-family="Pretendard" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">둘의 σ 평균 → 중간점</text><text x="860" y="420" font-family="Pretendard" font-size="29" font-weight="400" fill="#9FB0B2" text-anchor="start" xml:space="preserve">문턱선까지 효율선 위로 뜨면 선택 2도</text><text x="860" y="465" font-family="Pretendard" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve">미달 확률을 줄이려 위험을 다시 늘린다</text><text x="860" y="545" font-family="Pretendard" font-size="28" font-weight="400" fill="#9FB0B2" text-anchor="start" xml:space="preserve">고객은 이 선호 둘만 미리 말해 둔다 (정보 7 · 8)</text></svg>