<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="500" fill="#F7F5F0"/><rect x="10" y="10" width="1010" height="480" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="515" y="58" font-family="Pretendard" font-size="32" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">GBWM이 갖출 요건 아홉 (원문 3절)</text><text x="40" y="120" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">① 명료성 — 목표가 분명하다</text><text x="40" y="192" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">② 맞춤 — 목표마다 다른 조언</text><text x="40" y="264" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">③ 위험 구체성 — 확률을 늘 보인다</text><text x="40" y="336" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">④ 위험 준수 — 조언이 확률을 따른다</text><text x="40" y="408" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">⑤ 고객 언어 — 금액 · 시점 · 확률</text><text x="540" y="120" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">⑥ 상태 기준 — 종목 말고 전체</text><text x="540" y="192" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">⑦ 효율 — 늘 효율선 위</text><text x="540" y="264" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">⑧ 상태 의존 — 시장 따라 점이 움직인다</text><text x="540" y="336" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="start" xml:space="preserve">⑨ 재조정 규칙 — 정기 · 수시</text><rect x="1040" y="10" width="550" height="480" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="1315" y="58" font-family="Pretendard" font-size="32" font-weight="700" fill="#B7F34A" text-anchor="middle" xml:space="preserve">고객에게 묻는 정보 여덟</text><text x="1070" y="130" font-family="Pretendard" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(1) 기간 t</text><text x="1330" y="130" font-family="Pretendard" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(2) 초기 자산 W(0)</text><text x="1070" y="222" font-family="Pretendard" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(3) 목표 자산 W(t)</text><text x="1330" y="222" font-family="Pretendard" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(4) 목표 확률</text><text x="1070" y="314" font-family="Pretendard" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(5) 손실 문턱 자산</text><text x="1330" y="314" font-family="Pretendard" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">(6) 손실 문턱 확률</text><text x="1070" y="406" font-family="Pretendard" font-size="27" font-weight="400" fill="#B7F34A" text-anchor="start" xml:space="preserve">(7) 좋은 상태의 선호</text><text x="1330" y="406" font-family="Pretendard" font-size="27" font-weight="400" fill="#B7F34A" text-anchor="start" xml:space="preserve">(8) 나쁜 상태의 선호</text></svg>