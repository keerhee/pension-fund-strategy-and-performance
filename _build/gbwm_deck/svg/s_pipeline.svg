<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="600" fill="#F7F5F0"/><rect x="10" y="30" width="290" height="330" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="155" y="100" font-family="Pretendard" font-size="32" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">① 목표 수집</text><text x="155" y="190" font-family="Pretendard" font-size="27" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">금액 · 시점 · 부분 목표</text><text x="155" y="250" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">원하는 확률</text><line x1="303" y1="195" x2="325" y2="195" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="328" y="30" width="290" height="330" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="473" y="100" font-family="Pretendard" font-size="32" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">② 효율선 · 가정</text><text x="473" y="190" font-family="Pretendard" font-size="27" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">자본시장 가정 μ · Σ</text><text x="473" y="250" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">포트폴리오 15개</text><line x1="621" y1="195" x2="643" y2="195" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="646" y="30" width="290" height="330" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="791" y="100" font-family="Pretendard" font-size="32" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">③ DP 또는 MC</text><text x="791" y="190" font-family="Pretendard" font-size="27" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">DP로 전략 · 확률</text><text x="791" y="250" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">MC로 검증</text><line x1="939" y1="195" x2="961" y2="195" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="964" y="30" width="290" height="330" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="1109" y="100" font-family="Pretendard" font-size="32" font-weight="700" fill="#0B6B68" text-anchor="middle" xml:space="preserve">④ 확률 대시보드</text><text x="1109" y="190" font-family="Pretendard" font-size="27" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">목표별 확률 · 근접점</text><text x="1109" y="250" font-family="Pretendard" font-size="29" font-weight="400" fill="#102027" text-anchor="middle" xml:space="preserve">효용은 숨긴다</text><line x1="1257" y1="195" x2="1279" y2="195" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="1282" y="30" width="290" height="330" rx="0" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><text x="1427" y="100" font-family="Pretendard" font-size="32" font-weight="700" fill="#071A1D" text-anchor="middle" xml:space="preserve">⑤ 매년 재계산</text><text x="1427" y="190" font-family="Pretendard" font-size="27" font-weight="400" fill="#071A1D" text-anchor="middle" xml:space="preserve">자산 · 가정 · 목표 갱신</text><text x="1427" y="250" font-family="Pretendard" font-size="29" font-weight="400" fill="#071A1D" text-anchor="middle" xml:space="preserve">전략 표 다시</text><path d="M1440,364 C1440,440 160,440 160,368" fill="none" stroke="#0B6B68" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#ar)"/><rect x="10" y="470" width="1580" height="110" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="800" y="520" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="middle" xml:space="preserve">운용팀은 효율선(②), 자문팀은 목표 · 확률(①④)을 맡는다 — 원문 2018 4.5절 · 2020 1절의 '플러그 앤 플레이'</text><text x="800" y="562" font-family="Pretendard" font-size="28" font-weight="400" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">도구: 2020 DP는 numpy 1초 · 2022 여러 목표는 수 초 · 확률이 목표에 못 미치면 납입 · 목표 · 효용을 고친다</text></svg>