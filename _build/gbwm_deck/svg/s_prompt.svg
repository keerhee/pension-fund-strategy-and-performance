<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="540" fill="#F7F5F0"/><rect x="10" y="10" width="1580" height="520" rx="14" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="44" y="66" font-family="Pretendard" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">너는 목표기반 자산관리 분석가다. numpy만 써서 gbwm_dp.py 하나를 만들고 실행해줘.</text><text x="44" y="120" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">[논문] Das · Ostrov · Radhakrishnan · Srivastav (2020) 2절을 그대로 구현한다.</text><text x="44" y="174" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">[가정] 기대수익 (0.0493, 0.0770, 0.0886) · 공분산 원문 표 1(0.0309 대칭)</text><text x="44" y="228" font-family="Pretendard" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">  효율선 위 μ 0.0526 ~ 0.0886 등간격 15개 · W(0) 100 · G 200 · T 10년</text><text x="44" y="282" font-family="Pretendard" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">  격자: ln W를 σmin/3 간격, Z = ±3으로 끝을 잡고 W(0)이 격자점이 되게</text><text x="44" y="336" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">[할 일] ① 전이확률 행 정규화 ② V(T) = 1{W ≥ G}에서 Bellman 역산 ③ 분포 전파</text><text x="44" y="390" font-family="Pretendard" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">  ④ 고정 비교 ⑤ 번호가 바뀌는 자산 ⑥ C = +1 +3 +5 −1 −5 −10 (파산 처리)</text><text x="44" y="444" font-family="Pretendard" font-size="30" font-weight="700" fill="#B7F34A" text-anchor="start" xml:space="preserve">[검증] 약 330칸 · P ≈ 0.666 (원문 0.669) · 시작 μ 0.0835 · C −10 파산 약 12%</text><text x="44" y="498" font-family="Pretendard" font-size="30" font-weight="400" fill="#FFFFFF" text-anchor="start" xml:space="preserve">  1분 안 · argparse --rho --m --G · 주석 한국어 — 안 맞으면 스스로 고쳐줘</text></svg>