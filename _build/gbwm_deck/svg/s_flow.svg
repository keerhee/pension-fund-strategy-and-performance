<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0B6B68"/></marker></defs><rect width="1600" height="500" fill="#F7F5F0"/><rect x="10" y="8" width="560" height="98" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="290" y="69" font-family="Pretendard" font-size="32" font-weight="700" fill="#102027" text-anchor="middle" xml:space="preserve">목표가 하나인가?</text><line x1="574" y1="57" x2="660" y2="57" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="664" y="8" width="926" height="98" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="1127" y="69" font-family="Pretendard" font-size="31" font-weight="700" fill="#102027" text-anchor="middle" xml:space="preserve">예 · 여러 기간 → 2020 DP (자산 × 시점 격자)</text><line x1="290" y1="108" x2="290" y2="130" stroke="#0B6B68" stroke-width="4"/><rect x="10" y="132" width="560" height="98" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="290" y="193" font-family="Pretendard" font-size="32" font-weight="700" fill="#102027" text-anchor="middle" xml:space="preserve">한 기간 · 계정별 하한인가?</text><line x1="574" y1="181" x2="660" y2="181" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="664" y="132" width="926" height="98" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="1127" y="193" font-family="Pretendard" font-size="31" font-weight="700" fill="#102027" text-anchor="middle" xml:space="preserve">예 → Das–Markowitz (H, α) → γ</text><line x1="290" y1="232" x2="290" y2="254" stroke="#0B6B68" stroke-width="4"/><rect x="10" y="256" width="560" height="98" rx="0" fill="#FFFFFF" stroke="#DDE3E2" stroke-width="2"/><text x="290" y="317" font-family="Pretendard" font-size="32" font-weight="700" fill="#102027" text-anchor="middle" xml:space="preserve">목표 간 우선순위를 확률로?</text><line x1="574" y1="305" x2="660" y2="305" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="664" y="256" width="926" height="98" rx="0" fill="#B7F34A" stroke="#B7F34A" stroke-width="2"/><text x="1127" y="317" font-family="Pretendard" font-size="31" font-weight="700" fill="#071A1D" text-anchor="middle" xml:space="preserve">예 → EGP 근접점 · 아니면 2022 DP</text><line x1="290" y1="356" x2="290" y2="378" stroke="#0B6B68" stroke-width="4"/><rect x="10" y="380" width="560" height="98" rx="0" fill="#F7F5F0" stroke="#DDE3E2" stroke-width="2"/><text x="290" y="441" font-family="Pretendard" font-size="32" font-weight="700" fill="#64757D" text-anchor="middle" xml:space="preserve">바닥을 규칙으로 보장하려면?</text><line x1="574" y1="429" x2="660" y2="429" stroke="#0B6B68" stroke-width="4" marker-end="url(#ar)"/><rect x="664" y="380" width="926" height="98" rx="0" fill="#071A1D" stroke="#071A1D" stroke-width="2"/><text x="1127" y="441" font-family="Pretendard" font-size="31" font-weight="700" fill="#B7F34A" text-anchor="middle" xml:space="preserve">→ CPPI · Flexicure (floor + 승수 m)</text></svg>