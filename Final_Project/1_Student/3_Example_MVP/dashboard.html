\n|---|---|\n| 개요 | 성과·분기별 결정·기각안의 사후 성과 |\n| 분기 보기 | IC 보고서·CIO 결정·감사 기록. **[이 분기 다시 계산]** → 제출본과 숫자 대조 |\n| 공개 점검 T1~T8 | **[전체 실행]** — 약 10초 |\n| 라이브 점검 L1~L3 | IPS 바꿔 실행 · 가상 충격 · 결함 주입 (발표 당일) |\n| 문서 | IPS · 사전 등록 · CHANGELOG · CIO 개입 기록 · 의결문 |\n\n파이썬이 없으면 `dashboard.html`을 브라우저로 열어 같은 화면을 읽기 전용으로 본다.\nmacOS가 \"확인되지 않은 개발자\" 경고를 띄우면 `start.command`를 우클릭 → 열기.\n\n## 무엇이 다시 계산되고 무엇이 재생되는가\n\n| 부분 | 채점 콘솔에서 |\n|---|---|\n| CMA · 최적화 · 위험 지표 · 적격 심사 · 투표 점수 · 성과 | **다시 계산** — 코드가 계산하므로 제출본과 소수 6자리까지 같아야 한다 |\n| CIO 결정 · 변경 승인 | **입력으로 재생** — 사람이 적은 `data/cio_decisions.csv` · `data/approvals.csv` |\n| 에이전트의 판단 문장(매크로 해석·리서치 메모·검토 의견·투표 순위) | **녹화본 재생** — 이 예시는 규칙 기반 대역이라 재현된다. LLM 에이전트를 쓰는 팀은 문장이 매번 달라질 수 있으므로 양식과 근거 기록만 본다 |\n\nLLM 라이브 실행은 비용과 비결정성 때문에 채점자가 하지 않는다. 팀이 발표 때 Claude Code로 시연한다(`CLAUDE.md`).\n\n## 결과 요약\n\n| 경로 | 연율 수익 | 변동성 | 최대낙폭 |\n|---|---|---|---|\n| 채택 경로(CIO) | 7.90% | 9.61% | −7.3% |\n| 60/40 (SPY·IEF) | 11.82% | 11.26% | −7.3% |\n| MVO 계속 보유 (4개 분기 IPS 기각) | 11.57% | 8.61% | −5.3% |\n\n- 자동 기각 8건(MVO 4 · 적대적 분산자 4) — 모두 유효 종목 수 4.0 미만\n- CIO 개입 3회 — 조건부 승인 1, 반려 2 (`INTERVENTIONS.md`)\n- 변경 제안 4건 — 반영 0, 롤백 1, 반려 3 (`CHANGELOG.md`)\n- 공개 점검 T1~T8 전부 통과 (`reports/selfcheck.md`)\n- 도입 의결: **조건부 승인** — 6개월 분석 전용 병행 운영 (`reports/resolution.md`)\n\n## 구조\n\n```\nstart.command / start.bat   채점 콘솔 실행 (더블클릭)\ndashboard.html              정적 보기 (파이썬 없이)\nips.md                      정책 — 행동을 바꾸려면 코드가 아니라 이것을 고친다 (보호 파일)\nPREREG.md                   사전 등록표\nCHANGELOG.md                변경 제안 → 승인·반려 → 테스트 → 승격·롤백\nINTERVENTIONS.md            CIO 결정 기록\nCLAUDE.md                   Claude Code 라이브 모드 규칙\n.claude/agents/             에이전트 13개 정의\n.claude/skills/             스킬 7개 (보호 파일)\nconfig/                     파라미터 (보호 파일)\ndata/                       ETF 월간 수익률 · FRED 매크로 · 사람의 결정(cio_decisions.csv, approvals.csv)\nsdp/                        계산 코드 — 하네스·에이전트·오케스트레이터·점검·콘솔\nruns/{YYYY-MM}/             분기별 실행 증거 — cma · 배분안 · 적격 · CRO · 검토 · 투표 · IC 보고서 · CIO 결정 · trace.jsonl\nreports/                    성과 · 자가 점검 · 의결문\n```\n\n## 한 분기에 일어나는 일\n\n```\nmacro-agent → cma-builder → research-agent\n → PC 6개(동일가중·역변동성·최소분산·최대 샤프·ERC·적대적 분산자)\n → ips-guardian(자동 기각) → cro-agent → 상호 검토 → 수정 보르다 투표\n → meta-reviewer(직전 분기 사후 평가) → ic-agent → CIO(사람) → 변경 처리(킬스위치)\n```\n\n## 터미널을 쓰는 경우 (팀원용)\n\n```\npython -m sdp serve        채점 콘솔\npython -m sdp all          전 구간 다시 실행 (약 15초)\npython -m sdp quarter 2024-11\npython -m sdp check        공개 점검 T1~T8\npython -m sdp report       성과 보고서·대시보드 갱신\n```\n\n## 팀 제출 때 README에 넣을 표 (견본)\n\n| 구분 | 예시 MVP | 우리 팀 | 왜 바꿨나 |\n|---|---|---|---|\n| 기금 · IPS | 가상 기금 KFP (실질 4.5%, 변동성 10%) | (예) 대학 발전기금 — 지출률 5%, 실질 원금 보전 | |\n| 유니버스 · 데이터 | ETF 11개 · FRED 6개 | | |\n| 판단 부분 | 규칙 기반 대역 | (예) 리서치·검토·IC 보고서를 Claude Code 에이전트로, 녹화본 재생 | |\n| PC 에이전트 | 6개 | (예) + LLM 뷰 블랙-리터만 | |\n| 감독 장치 | 자동 기각 · 킬스위치 · 날짜 검사 | (예) + 국면 전환 시 학습 정지 | |\n\n## 데이터\n\n데이터 사전은 `data/DATA.md`, 내려받기는 `python data/fetch_data.py`. ETF 11개 월간 총수익률(과정 저장소 `self-driving-mvp/data/panel_monthly.csv`, yfinance)과 FRED 월평균(DGS3MO, DGS10, T10Y2Y, CPIAUCSL, UNRATE, BAA10Y). 물가·실업률은 발표 지연 1개월을 반영해 읽는다(`sdp/data.py`).\n", "ips": "# 투자정책서(IPS) — 가상 기금 KFP (예시 MVP)\n\n> 이 문서가 파이프라인의 헌법이다. 모든 에이전트는 이 문서의 제약 안에서만 산출물을 낸다.\n> 행동을 바꾸려면 코드가 아니라 이 문서를 고친다. 이 문서는 하네스가 보호하는 파일이며,\n> 에이전트는 고칠 수 없다(7.4항). 변경은 `CHANGELOG.md`에 CIO 승인이 있어야 한다.\n\n## 1. 기금 개요\n\n가상 기금 KFP(Korea Future Pension)는 공적 성격의 확정급여형 기금이다.\n운용자산 40조 원, 부채 수정듀레이션 18.0년, 지급 정점은 30년 후다.\n\n## 2. 투자 목표\n\n장기 실질수익률 연 4.5%(명목 약 6.5%)를 목표로 한다. 초과 달성보다 미달 회피를 우선한다.\n\n## 3. 위험 허용도\n\n- 사전 변동성(CMA 기준) **연 10% 이하**\n- 최대낙폭(MDD) **−20%** 이내 관리 (사후 점검 지표)\n\n## 4. 자산배분 범위\n\n| 자산군 | 하한 | 상한 | 구성 ETF |\n|---|---|---|---|\n| 주식 | 30% | 60% | SPY · EFA · EEM |\n| 채권 | 25% | 55% | IEF · TLT · LQD · HYG · TIP |\n| 대체 | 5% | 25% | VNQ · GLD · DBC |\n\n개별 ETF 비중은 **30% 이하**. 공매도·레버리지 금지. 비중 합은 100%.\n\n## 5. 분산 요건\n\n유효 종목 수 $N_{\\text{eff}} = 1/\\sum_i w_i^2$ 가 **4.0 이상**이어야 한다.\n\n## 6. 리밸런싱\n\n분기 말(2·5·8·11월 말)에 결정하고, 다음 석 달 동안 목표 비중을 유지한다.\n\n## 7. 자율 파이프라인에 대한 감독\n\n1. 에이전트의 산출물은 권고안이다. CIO 승인 없이 집행되지 않는다.\n2. 모든 권고안은 근거를 남긴다(`trace.jsonl`). 근거가 없는 안은 무효다.\n3. 4·5항과 3항의 사전 변동성 한도를 어긴 안은 자동 기각하고 표결에 올리지 않는다.\n4. 킬스위치 — 에이전트는 이 문서·스킬·파라미터를 직접 고치지 못한다. 수정은 제안서로만 남고, CIO 승인과 테스트를 거쳐야 반영된다.\n5. 책임은 이전되지 않는다. 운용 결과의 책임은 기금과 그 의사결정 기구에 있다.\n\n## 부록 A. 기계가 읽는 제약\n\n본문과 값이 다르면 본문이 우선한다.\n\n```yaml\nconstraints:\n  weight_sum: 1.0\n  asset_max: 0.30\n  asset_min: 0.0\n  long_only: true\n  effective_n_min: 4.0\n  vol_cap: 0.10\n  groups:\n    equity:       {members: [SPY, EFA, EEM],           min: 0.30, max: 0.60}\n    fixed_income: {members: [IEF, TLT, LQD, HYG, TIP], min: 0.25, max: 0.55}\n    alternative:  {members: [VNQ, GLD, DBC],           min: 0.05, max: 0.25}\nobjectives:\n  nominal_target: 0.065\n  mdd_limit: -0.20\n```\n\n## 변경 이력\n\n| 날짜 | 내용 | 승인 |\n|---|---|---|\n| 2022-08-31 | 초판 | CIO |\n", "changelog": "# CHANGELOG — 변경 제안과 처리 (킬스위치 기록)\n\n| 분기 | 제안 | 제안자 | 내용 | CIO | 결과 | 사유 |\n|---|---|---|---|---|---|---|\n| 2022-08 | `P-2022-08-research-ips` | research-agent | 채권군 하한 25% → 15% 한시 완화 (물가 가속 국면 동안) | 반려 | **미반영** | CIO 반려: 한 국면의 근거로 부채 헤지용 채권 하한을 낮추지 않는다. 국면 대응은 IPS 범위 안의 배분으로 한다. |\n| 2023-02 | `P-2023-02-meta-delta` | meta-reviewer | 기대수익률 수축 강도 δ 0.5 → 0.7 | 승인 | **롤백** | 테스트 미통과 (과거 8분기 재추정 MAE 21.16% → 21.19%) |\n| 2024-02 | `P-2024-02-meta-delta` | meta-reviewer | 기대수익률 수축 강도 δ 0.5 → 0.7 | 반려 | **미반영** | CIO 반려: 테스트에서 개선이 없다(17.26%→17.28%). 같은 제안이 2023-02에도 롤백됐다. |\n| 2025-02 | `P-2025-02-meta-delta` | meta-reviewer | 기대수익률 수축 강도 δ 0.5 → 0.7 | 반려 | **미반영** | CIO 반려: 세 번째 같은 제안이며 테스트에서 개선이 없다(13.59%→13.67%). 오차의 원인은 수축 강도가 아니라 국면 변화로 본다. |\n", "interventions": "# INTERVENTIONS — CIO 결정 기록 (예시: 사람 CIO가 IC 보고서를 읽고 적은 결정)\n\n| 분기 | IC 권고 | 결정 | 조건 | 사유 |\n|---|---|---|---|---|\n| 2022-08 | 최소분산 | 승인 | — | 최소분산안은 IPS 경계(IEF 30%)에 붙어 있으나 위반은 아니다. 물가 가속 국면에서 2022 금리 충격 손실이 −10.7%로 차점안보다 작다. |\n| 2022-11 | 최소분산 | 승인 | — | 적대적 분산자는 유효 종목 수 3.93으로 자동 기각됐다. 권고안과 차점안의 점수 차(0.148)가 커서 권고를 따른다. |\n| 2023-02 | 동일가중 (IPS 투영) | 승인 | — | 1·2위 점수 차가 0.002로 사실상 동점이다. 두 안 모두 분산형이고 최하위 지목이 없어 권고안을 그대로 받는다. |\n| 2023-05 | 동일가중 (IPS 투영) | 승인 | — | 직전 분기와 같은 안이 다시 권고됐고 회전율 부담이 없다. |\n| 2023-08 | 동일가중 (IPS 투영) | 조건부 승인 | cap:EEM:0.05 | 1·2위 점수 차 0.008로 근소하다. 장단기 금리차 역전이 1년 넘게 이어져 신흥국 비중을 5%로 묶는 조건을 붙인다. 모든 안의 기대수익이 명목 목표 6.5%를 밑돈다는 점은 다음 분기 IPS 점검 안건으로 넘긴다. |\n| 2023-11 | 위험기여 균등 (ERC) | 승인 | — | ERC가 최하위 지목 없이 1위다. 적대적 분산자는 유효 종목 수 3.94로 기각됐다. 기대수익이 목표를 밑도는 문제는 IPS 점검 안건으로 유지한다. |\n| 2024-02 | 위험기여 균등 (ERC) | 승인 | — | ERC가 두 분기 연속 1위다. MVO가 유효 종목 수 3.97로 기각된 점은 사후 평가에서 확인한다. |\n| 2024-05 | 위험기여 균등 (ERC) | 승인 | — | 국면이 곡선 역전으로 바뀌었으나 ERC의 하이일드·신흥국 비중(7.0%·9.7%)은 국면 벌점을 반영한 정량 점수 후에도 1위다. |\n| 2024-08 | 위험기여 균등 (ERC) | 승인 | — | 현 보유 대비 회전율 0.3%로 사실상 유지다. |\n| 2024-11 | 최소분산 | 반려 | — | 1위(최소분산)와 3위(현 보유 ERC)의 점수 차가 0.024에 불과한데 회전율은 32.3%다. 점수 차가 추정오차 안에 있는 교체는 거래비용만 낸다. 현 보유를 유지하고 다음 분기에 재심한다. |\n| 2025-02 | 최소분산 | 반려 | — | 1·2위 점수 차가 0.001이고 2위가 현 보유(ERC)다. 회전율 34.9%를 정당화할 근거가 없다. |\n| 2025-05 | 위험기여 균등 (ERC) | 승인 | — | 현 보유(ERC)가 다시 1위로 권고됐다. 회전율 1.2%. |\n", "resolution": "# 도입 의결문 (예시) — \"자율주행 포트폴리오를 KFP에 도입할 것인가\"\n\n**의결: 조건부 승인** — 분석 전용으로 6개월 병행 운영한 뒤 재심한다.\n\n## 근거\n1. **감독 장치는 설계대로 작동했다.** 12개 분기 내내 IPS 위반안 8건(MVO 4, 적대적 분산자 4)이 자동 기각됐다. 에이전트의 자기 수정 시도는 하네스가 막았고(점검 T3), 결정 시점 이후 사건이 섞이면 분기를 멈췄다(L3). 모든 결정은 trace로 입력 데이터까지 거슬러 갈 수 있다(T7).\n2. **성과는 비교 기준보다 낮았다.** 채택 경로 연율 7.90%(변동성 9.61%)로 60/40의 11.82%에 못 미쳤다. 같은 구간에 미국 주식이 강했고, IPS가 주식을 60% 이하·채권을 25% 이상으로 묶은 영향이 크다.\n3. **규율의 대가가 드러났다.** 유효 종목 수 3.77~3.97로 기각된 MVO를 계속 들었다면 연율 11.57%였다. 다만 35개월 한 구간의 결과이므로 하한을 낮추는 근거로 바로 쓰지 않는다(사전 등록 원칙). L1 시연에서 하한을 3.5로 낮추면 2024-02 권고가 ERC에서 동일가중으로 바뀌었다 — 규칙이 결론을 움직인다는 뜻이고, 그래서 규칙 변경은 성과를 보기 전에 정해야 한다.\n4. **학습 루프는 아직 약하다.** 메타 리뷰가 같은 제안(δ 0.5→0.7)을 세 번 냈고 세 번 모두 테스트에서 개선이 없었다(1회 롤백, 2회 반려). 평균 예측오차 14.1%는 수축 강도가 아니라 국면 변화(2022 물가 가속 → 디스인플레이션)에서 왔다. CFA Institute가 지적한 국면 민감성에 이 시스템은 대응하지 못한다.\n5. **사람의 개입은 세 번이었다.** 조건부 승인 1회(신흥국 상한 5%), 반려 2회(점수 차 0.001~0.024에 회전율 32~35%). 반려 두 번의 사후 효과는 −0.13%p, +0.11%p로 상쇄됐다 — 개입의 가치는 수익이 아니라 거래비용과 추정오차에 대한 판단에 있었다.\n\n## 조건\n1. 6개월 동안 **분석 전용**으로 사람 IC와 병행 운영한다. 매매·외부 발송 기능은 두지 않는다.\n2. 국면 전환을 감지하면 메타 리뷰 제안을 멈추고 사람에게 넘기는 장치를 추가한다.\n3. 유효 종목 수 하한(4.0)과 주식 상한(60%)의 재검토는 다음 연도 IPS 개정 때 **사전 등록**으로만 다룬다.\n4. 재심 때 공개 점검 T1~T8과 라이브 점검 L1~L3을 다시 통과해야 한다.\n\nCIO (예시) · 2025-07\n", "performance": "# 성과 보고서 (예시 MVP · 가상 기금 KFP)\n\n평가 구간 2022-09 ~ 2025-07 · 무위험 4.91% · 분기 말 결정 12회\n\n| 경로 | 연율 수익 | 변동성 | 샤프 | 최대낙폭 | 누적 |\n|---|---|---|---|---|---|\n| 채택 경로(CIO) | 7.90% | 9.61% | 0.31 | -7.3% | 24.8% |\n| 60/40 (SPY·IEF) | 11.82% | 11.26% | 0.61 | -7.3% | 38.5% |\n| 동일가중 1/11 | 7.63% | 10.39% | 0.26 | -7.2% | 23.9% |\n| 적대적 분산자 — 계속 보유 가정 | 6.34% | 10.08% | 0.14 | -9.3% | 19.6% |\n| 동일가중 (IPS 투영) — 계속 보유 가정 | 7.82% | 10.52% | 0.28 | -7.3% | 24.6% |\n| 위험기여 균등 (ERC) — 계속 보유 가정 | 7.71% | 10.14% | 0.28 | -7.2% | 24.2% |\n| 역변동성 (IPS 투영) — 계속 보유 가정 | 7.76% | 9.97% | 0.29 | -6.9% | 24.3% |\n| 최대 샤프 (MVO) — 계속 보유 가정 | 11.57% | 8.61% | 0.77 | -5.3% | 37.6% |\n| 최소분산 — 계속 보유 가정 | 8.08% | 8.70% | 0.36 | -5.4% | 25.4% |\n\n채택 경로 평균 분기 회전율 6.2% · CMA 평균 절대 예측오차 14.1%\n\n## 기각된 안의 사후 성과\n\n- 적대적 분산자: 4개 분기 기각 (2022-11, 2023-11, 2024-02, 2024-05) — 계속 보유했다면 연율 6.34%, 채택 경로 7.90%\n- 최대 샤프 (MVO): 4개 분기 기각 (2024-02, 2024-11, 2025-02, 2025-05) — 계속 보유했다면 연율 11.57%, 채택 경로 7.90%\n\n주의: 한 구간(35개월)의 결과다. 기각안이 사후에 더 좋았다는 사실만으로 규칙을 완화하지 않는다(사전 등록 원칙).\n", "prereg": "# 사전 등록표 (2022-08-31, 첫 결정 전에 고정)\n\n평가 구간의 결과를 보고 아래 값을 바꾸면 그 사유를 `CHANGELOG.md`에 남긴다. 이 예시에서는 바꾼 값이 없다.\n\n| 항목 | 값 | 근거 |\n|---|---|---|\n| 평가 구간 | 2022.9 ~ 2025.7 (분기 말 결정 12회) | 학습 84개월 뒤 전 구간 |\n| CMA 추정 창 | 직전 84개월 | W03 실습과 동일 |\n| 기대수익률 수축 강도 δ | 0.5 | 역사적 평균의 추정오차 $SE(\\hat\\mu)=\\sigma/\\sqrt{T}$가 크다 |\n| 공분산 | Ledoit–Wolf 수축(단위행렬 목표) | 표본 공분산의 추정오차 완화 |\n| PC 에이전트 | 동일가중·역변동성·최소분산·최대 샤프·ERC·적대적 분산자 (6개) | 네 계열 + 적대적 분산자 |\n| 적대적 분산자 샤프 하한 | 다른 다섯 안의 샤프 중앙값 | 합의와 다르되 질이 떨어지지 않게 |\n| 투표 규칙 | 자기 제외 상위 4개 5·4·3·2점, <script>
const STATIC = window.STATIC_DATA || null;

const NAMES = {"pc-equal":"동일가중","pc-invvol":"역변동성","pc-minvar":"최소분산","pc-maxsharpe":"최대 샤프(MVO)","pc-erc":"ERC","pc-adversarial":"적대적 분산자"};
let S = null, curTab = "home", curQ = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(src){
  const lines = (src||"").split("\n"); let h = "", i = 0;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  while(i < lines.length){
    const l = lines[i];
    if(/^\|/.test(l)){ let rows=[]; while(i<lines.length && /^\|/.test(lines[i])){ if(!/^\|[\s\-:|]+\|$/.test(lines[i])) rows.push(lines[i]); i++; }
      h += "<table>" + rows.map((r,k)=>"<tr>"+r.replace(/^\||\|$/g,"").split("|").map(c=>k?`<td>${inl(c.trim())}</td>`:`<th>${inl(c.trim())}</th>`).join("")+"</tr>").join("") + "</table>"; continue; }
    if(/^```/.test(l)){ let b=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++; h += `<pre class="trace">${esc(b.join("\n"))}</pre>`; continue; }
    if(/^### /.test(l)) h += `<h3>${inl(l.slice(4))}</h3>`; else if(/^## /.test(l)) h += `<h2>${inl(l.slice(3))}</h2>`; else if(/^# /.test(l)) h += `<h1>${inl(l.slice(2))}</h1>`;
    else if(/^\s*[-*] /.test(l)){ let it=[]; while(i<lines.length && /^\s*[-*] /.test(lines[i])) it.push(lines[i++].replace(/^\s*[-*] /,"")); h += "<ul>"+it.map(x=>`<li>${inl(x)}</li>`).join("")+"</ul>"; continue; }
    else if(/^\d+\. /.test(l)){ let it=[]; while(i<lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /,"")); h += "<ol>"+it.map(x=>`<li>${inl(x)}</li>`).join("")+"</ol>"; continue; }
    else if(/^> /.test(l)) h += `<p class="small">${inl(l.slice(2))}</p>`;
    else if(l.trim()) h += `<p>${inl(l)}</p>`;
    i++;
  }
  return `<div class="md">${h}</div>`;
}
function math(el){ if(window.renderMathInElement) try{ renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false}); }catch(e){} }
async function api(path, body){
  if(STATIC){ if(path==="/api/summary") return STATIC.summary; if(path.startsWith("/api/quarter")) return STATIC.quarters[new URLSearchParams(path.split("?")[1]).get("q")]; throw new Error("정적 보기에서는 실행할 수 없다"); }

  return r.json();

function busy(btn, on, label){ btn.disabled = on; btn.innerHTML = on ? `<span class="spin"></span>실행 중…` : label; }

const pct = (x,d=1)=> (x*100).toFixed(d)+"%";

function chart(p){
  const keys = [["채택 경로(CIO)","#0B1F3A",3],["60/40 (SPY·IEF)","#9AA7BA",2],["pc-maxsharpe","#F28C28",2],["pc-minvar","#1E9C9C",2]];
  const W=760,H=260,L=46,R=12,T=12,B=28; const n=p.dates.length;
  const all = keys.flatMap(([k])=>p.cum_paths[k]); const lo=Math.min(1,...all), hi=Math.max(...all);
  const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g=""; for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAF1"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5E6B80">${((v-1)*100).toFixed(0)}%</text>`; }
  p.dates.forEach((d,i)=>{ if(i%6===0) g+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#5E6B80">${d}</text>`; });
  const lines = keys.map(([k,c,w])=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${p.cum_paths[k].map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}${lines}</svg><div class="legend">${keys.map(([k,c])=>`<span><i style="background:${c}"></i>${esc(NAMES[k]?NAMES[k]+" (계속 보유 가정)":k)}</span>`).join("")}</div>`;
}

async function home(){

    ${k("공개 점검", sc? `${sc.filter(r=>r.pass).length} / ${sc.length}` : "미실행", "T1~T8 — 탭에서 다시 실행")}

    <div class="card"><h3>분기별 결정 — 행을 누르면 그 분기로 간다</h3><table><tr><th>분기</th><th>국면</th><th>IC 권고</th><th>CIO</th><th>자동 기각</th></tr>
      ${s.quarters.map(r=>`<tr style="cursor:pointer" onclick="curQ='${r.q}';go('quarter')"><td>${r.q}</td><td>${esc(r.regime)}</td><td>${esc(NAMES[r.winner]||r.winner||"없음")}</td><td>${decPill(r.decision)}</td><td class="small">${r.rejected.map(x=>NAMES[x]).join(", ")||"—"}</td></tr>`).join("")}</table></div>
  </div>
  <div class="card" style="margin-top:16px">${md(s.docs.performance)}</div>`;
}

async function quarter(){

  const sc = S.selfcheck || [];
  const rows = (sc.length?sc:Object.keys(TDESC).map(id=>({id,name:"",pass:null,detail:""}))).map(r=>`<tr><td><b>${r.id}</b></td><td>${esc(TDESC[r.id])}</td><td>${r.pass===null?'<span class="pill wait">미실행</span>':r.pass?'<span class="pill ok">통과</span>':'<span class="pill no">실패</span>'}</td><td class="small">${esc(r.detail)}</td><td class="small">${r.sec??""}${r.sec!=null?"초":""}</td></tr>`).join("");
  $("#main").innerHTML = `<div class="card"><h3>공개 점검 T1~T8 — 팀이 제출 전에 돌리고, 채점자가 똑같이 다시 돌린다</h3>
    <p class="small">모든 점검은 임시 복사본에서 돈다. 제출 폴더는 바뀌지 않는다. 판단 문장(LLM 부분)은 정확히 같은지 보지 않고, 코드로 계산한 숫자만 정확히 대조한다.</p>
    <button class="btn alt" id="sc" onclick="runCheck()" ${STATIC?"disabled":""}>T1~T8 전체 실행 (약 10초)</button>
    <table style="margin-top:12px"><tr><th>#</th><th>방법</th><th>결과</th><th>내용</th><th>시간</th></tr>${rows}</table></div>`;
}
async function runCheck(){ const b=$("#sc"); busy(b,true); const r=await api("/api/selfcheck",{}); S.selfcheck=r; check(); }

  <div class="grid g3">
   <div class="card"><h3>L1 · IPS 조항 바꿔 다시 실행</h3>

    <div class="row"><div><label>사전 변동성 한도 vol_cap</label><input id="l1v" value="0.10"></div><div><label>종목 상한 asset_max</label><input id="l1m" value="0.30"></div></div>
    <div class="row"><div><label>유효 종목 수 하한</label><input id="l1n" value="3.5"></div><div><label>대체 상한</label><input id="l1a" value="0.25"></div></div>

   <div class="card"><h3>L2 · 가상의 다음 달 충격</h3>
    <div class="row"><div><label>주식 한 달 수익률(%)</label><input id="l2e" value="-15"></div><div><label>금리 변화(bp)</label><input id="l2r" value="150"></div></div>

    <p class="small">(가) 비중 합이 1.03인 배분안을 끼워 넣는다.<br>(나) 2024-11 리서치 메모에 그 뒤(2025-03)의 사건을 섞는다.</p>
    <div class="row"><button class="btn" id="b3a" onclick="L3('sum103')" ${STATIC?"disabled":""}>(가) 실행</button><button class="btn" id="b3b" onclick="L3('future_memo')" ${STATIC?"disabled":""}>(나) 실행</button></div></div>
  </div>
  <div class="card" style="margin-top:16px" id="lout"><p class="small">결과가 여기 나온다.</p></div>`;

async function L1(){ const b=$("#b1"); busy(b,true);
  const r = await api("/api/l1",{q:$("#l1q").value, overrides:{vol_cap:+$("#l1v").value, asset_max:+$("#l1m").value, effective_n_min:+$("#l1n").value, "groups.alternative.max":+$("#l1a").value}}); busy(b,false,"실행");
  if(r.error){ $("#lout").innerHTML=`<pre class="trace">${esc(r.error)}</pre>`; return; }
  const ks = Object.keys(r.before.eligible);
  $("#lout").innerHTML = `<h3>L1 결과 — 권고 ${esc(NAMES[r.before.winner]||r.before.winner)} → <b>${esc(NAMES[r.after.winner]||r.after.winner||"없음 (전 안 기각)")}</b></h3>
   <table><tr><th>안</th><th>제출본 IPS</th><th>바꾼 IPS</th><th>위반 사유</th></tr>${ks.map(k=>`<tr><td>${NAMES[k]}</td><td>${r.before.eligible[k]?'<span class="pill ok">적격</span>':'<span class="pill no">기각</span>'}</td><td>${r.after.eligible[k]?'<span class="pill ok">적격</span>':'<span class="pill no">기각</span>'}</td><td class="small">${esc((r.after.violations[k]||[]).join("; "))}</td></tr>`).join("")}</table>${md(r.ic_report)}`; }
async function L2(){ const b=$("#b2"); busy(b,true);
  const r = await api("/api/l2",{equity:$("#l2e").value, rate_bp:$("#l2r").value, gold:$("#l2g").value, commodity:$("#l2c").value}); busy(b,false,"실행");
  $("#lout").innerHTML = r.error?`<pre class="trace">${esc(r.error)}</pre>`:`<p class="banner">${esc(r.note)}</p><div class="grid g2"><div>${md(r.ic_report)}</div><div>${md(r.cio)}<h3>붙인 충격(월 수익률 %)</h3><pre class="trace">${esc(JSON.stringify(r.shock_row,null,1))}</pre></div></div>`; }
async function L3(kind){ const b=$(kind==="sum103"?"#b3a":"#b3b"); busy(b,true); const r = await api("/api/l3",{kind}); busy(b,false,kind==="sum103"?"(가) 실행":"(나) 실행");
  $("#lout").innerHTML = r.error?`<pre class="trace">${esc(r.error)}</pre>`:`<h3>L3 ${kind==="sum103"?"(가) 비중 합 1.03":"(나) 미래 사건 혼입"} — ${r.caught?'<span class="pill ok">잡아냈다</span>':'<span class="pill no">놓쳤다</span>'}</h3><p>잡은 곳: <b>${esc(r.where)}</b></p>${r.injected?`<p class="small">주입한 문장: ${esc(r.injected)}</p>`:""}<pre class="trace">${esc(JSON.stringify(r.evidence,null,1))}\n\n${esc(r.log||"")}</pre>`; }

async function docs(){
  const D = S.docs; const keys=[["readme","README"],["ips","IPS"],["prereg","사전 등록"],["changelog","CHANGELOG"],["interventions","CIO 개입 기록"],["resolution","도입 의결문"]];
  $("#main").innerHTML = `<div class="chips">${keys.map(([k,v],i)=>`<button class="chip ${i===0?'on':''}" onclick="document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');document.getElementById('doc').innerHTML=md(S.docs['${k}']);math(document.getElementById('doc'))">${v}</button>`).join("")}</div><div class="card" id="doc">${md(D.readme)}</div>`; math($("#doc"));
}
